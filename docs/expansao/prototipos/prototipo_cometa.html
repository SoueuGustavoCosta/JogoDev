<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo: cometa e fios do tear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--panel:#12101f;--cyan:#3df5ff;--tva:#ff9a2e;--pink:#ff3db8;--txt:#e9e6ff;--dim:#8a84b3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"Oxanium",system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;min-height:560px;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
svg,#ceu{position:absolute;inset:0;width:100%;height:100%}
#ceu{pointer-events:none;z-index:4}
#hit{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:transparent;border:none;cursor:pointer;z-index:5}
#hit:focus-visible{outline:2px solid var(--tva)}
text{font-family:"Oxanium",sans-serif}
#card{position:absolute;left:50%;bottom:24px;transform:translate(-50%,160%);width:min(340px,90%);background:var(--panel);
  border:1px solid var(--cyan);border-radius:14px;padding:16px 18px;transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:6}
#card.show{transform:translate(-50%,0)}
#card.urg{border-color:var(--pink)}
#card h2{font-size:18px;font-weight:600;margin-bottom:4px}
#card p{color:var(--dim);font-size:14px}
#tempo{font-size:32px;font-weight:800;color:var(--cyan);margin:10px 0 12px;font-variant-numeric:tabular-nums}
#card.urg #tempo{color:var(--pink)}
.row{display:flex;gap:8px;align-items:center}
button.b{font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid #3a3462;background:rgba(7,6,15,.6);color:var(--txt);cursor:pointer}
button.b.p{background:var(--cyan);color:#07060f;border-color:var(--cyan);font-weight:600}
button.b:focus-visible,input:focus-visible{outline:2px solid var(--tva);outline-offset:2px}
#ctrl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:7}
#sim{background:rgba(18,16,31,.85);border:1px solid #2c2748;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--dim)}
#sim input{width:100%;accent-color:var(--cyan);margin:6px 0 4px}
#status{color:var(--txt);font-size:14px}
#flash{position:absolute;inset:0;background:var(--tva);opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:nexus .9s ease-out}
@keyframes nexus{0%{opacity:.8}100%{opacity:0}}
#stage.distorce{animation:dist .6s}
@keyframes dist{30%{transform:skewX(4deg) scale(1.02);filter:hue-rotate(60deg)}60%{transform:skewX(-3deg)}}
</style>
</head>
<body>
<div id="stage">
  <div id="ctrl">
    <div class="row"><button class="b" id="btnNexus">Concluir ilha Python</button><button class="b" id="btnPlay">Acelerar tempo</button></div>
    <div id="sim">
      <label for="dia">Simulação: dia do ciclo (3 semanas de cometa + 7 dias de intervalo)</label>
      <input type="range" id="dia" min="0" max="28" step="0.01" value="4">
      <div id="status">--</div>
    </div>
  </div>

  <svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" aria-label="Portal Python com três portais de frameworks">
    <defs id="defs"></defs>
    <g id="fios"></g>
    <g id="portais"></g>
    <text x="200" y="540" text-anchor="middle" fill="#8a84b3" font-size="13" id="legenda">Conclua a ilha para abrir os portais</text>
  </svg>

  <canvas id="ceu"></canvas>
  <button id="hit" aria-label="Ver cometa"></button>

  <div id="card" role="dialog" aria-live="polite">
    <h2>Cometa Docker</h2>
    <p>5 trilhas. Some da linha do tempo em:</p>
    <div id="tempo">--</div>
    <div class="row"><button class="b p">Entrar no cometa</button><button class="b" id="fechar">Depois</button></div>
  </div>
  <div id="flash"></div>
</div>

<script>
const stage=document.getElementById('stage');
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';stage.prepend(s)}
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
let T=0;

/* ---------- portais ---------- */
const gP=document.getElementById('portais'),gF=document.getElementById('fios'),defs=document.getElementById('defs');
function el(par,n,at){const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
function espiral(R){let d='';for(let braco=0;braco<2;braco++){for(let k=0;k<=60;k++){const s=k/60,r=R*(1-s)*.95,a=braco*Math.PI+s*Math.PI*5;
  d+=(k?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)}}return d}
function portal(id,x,y,R,c,nome){
  const gr=el(defs,'radialGradient',{id:'g'+id});
  el(gr,'stop',{offset:'0%','stop-color':'#07060f'});el(gr,'stop',{offset:'70%','stop-color':'#0d0b1c'});
  el(gr,'stop',{offset:'100%','stop-color':c,'stop-opacity':.35});
  const p={x,y,R,c};
  p.g=el(gP,'g',{});
  p.oval=el(p.g,'g',{});
  p.anelFora=el(p.oval,'circle',{r:R+8,fill:'none',stroke:c,'stroke-width':1.2,'stroke-dasharray':'10 14'});
  p.miolo=el(p.oval,'g',{});
  el(p.miolo,'circle',{r:R,fill:`url(#g${id})`});
  p.vort=el(p.miolo,'path',{d:espiral(R),fill:'none',stroke:c,'stroke-width':1.4,opacity:.55});
  p.anelDentro=el(p.miolo,'circle',{r:R*.7,fill:'none',stroke:c,'stroke-width':1.5,'stroke-dasharray':'2 8',opacity:.8});
  p.parts=[...Array(8)].map(()=>el(p.miolo,'circle',{r:1.8,fill:'#fff'}));
  p.borda=el(p.oval,'circle',{r:R,fill:'none',stroke:c,'stroke-width':3});
  p.txt=el(p.g,'text',{'text-anchor':'middle',fill:nome==='Python'?c:'#e9e6ff','font-size':nome==='Python'?20:15,'font-weight':nome==='Python'?800:400});
  p.txt.textContent=nome;
  return p}
const py=portal('py',200,420,58,'#ff9a2e','Python');
const ramos=[
  {nome:'Django',c:'#3df5ff',pos:[82,205]},
  {nome:'FastAPI',c:'#b6ff3d',pos:[200,165]},
  {nome:'Flask',c:'#ff3db8',pos:[318,205]}];
ramos.forEach((r,i)=>{
  r.base=el(gF,'path',{fill:'none',stroke:'#2c2748','stroke-width':2,'stroke-dasharray':'4 8'});
  r.f1=el(gF,'path',{fill:'none',stroke:r.c,'stroke-width':2.4,'stroke-linecap':'round'});
  r.f2=el(gF,'path',{fill:'none',stroke:r.c,'stroke-width':1.4,'stroke-linecap':'round',opacity:.55});
  r.dots=[0,1,2].map(()=>el(gF,'circle',{r:3,fill:'#fff',opacity:0}));
  r.fase=i*2.1;r.p=portal('r'+i,r.pos[0],r.pos[1],24,r.c,r.nome);
});
function desenhaPortal(p,x,y,o,vel){
  const sx=.8,sy=1.18;
  p.oval.setAttribute('transform',`translate(${x} ${y}) scale(${sx} ${sy})`);
  p.miolo.setAttribute('transform',`scale(${Math.max(.001,o)})`);
  p.vort.setAttribute('transform',`rotate(${-T*70*vel})`);
  p.anelDentro.setAttribute('transform',`rotate(${-T*110*vel})`);
  p.anelFora.setAttribute('transform',`rotate(${T*35*vel})`);
  p.anelFora.setAttribute('opacity',.25+.6*o);
  p.borda.setAttribute('opacity',.35+.65*o);
  p.borda.setAttribute('stroke-dasharray',o<.05?'3 6':'none');
  p.parts.forEach((c,k)=>{const f=(T*.45*vel+k/8)%1,r=p.R*(1-f),a=k*.785+f*6;
    c.setAttribute('cx',Math.cos(a)*r);c.setAttribute('cy',Math.sin(a)*r);c.setAttribute('opacity',Math.sin(Math.PI*f)*o)});
  p.txt.setAttribute('x',x);p.txt.setAttribute('y',p.R>40?y+p.R*sy+34:y-p.R*sy-14);
  p.txt.setAttribute('opacity',.4+.6*o);
}
function cub(b,s){const a=1-s;const f=i=>a*a*a*b[0][i]+3*a*a*s*b[1][i]+3*a*s*s*b[2][i]+s*s*s*b[3][i];return[f(0),f(1)]}
function fio(b,ph,ate,amp,fase){let d='';const N=50;
  for(let k=0;k<=N;k++){const s=k/N*ate,[x,y]=cub(b,s),[x2,y2]=cub(b,Math.min(1,s+.01));
    const dx=x2-x,dy=y2-y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    const off=Math.sin(s*Math.PI*5-T*2.2+ph+fase)*amp*Math.sin(Math.PI*s);
    d+=(k?'L':'M')+(x+nx*off).toFixed(1)+' '+(y+ny*off).toFixed(1)}
  return d}
let prog=0,alvo=0;
function frameMapa(dt){
  if(!reduz)T+=dt;
  const pyY=420+Math.sin(T*.8)*3;
  desenhaPortal(py,200,pyY,1,1);
  prog+=(alvo-prog)*Math.min(1,dt*2.2);
  ramos.forEach((r,i)=>{
    const nx=r.pos[0],ny=r.pos[1]+Math.sin(T*.9+i*2)*3;
    const p=Math.max(0,Math.min(1,prog*1.25-i*.08));
    const o=Math.max(0,Math.min(1,(p-.85)/.15));
    desenhaPortal(r.p,nx,ny,o,1.4);
    const topoPy=pyY-58*1.18,baseN=ny+24*1.18,sw=Math.sin(T*.6+i)*10;
    const b=[[200+(nx-200)*.15,topoPy],[200+(nx-200)*.2+sw,topoPy-60],[nx-sw,baseN+60],[nx,baseN]];
    r.base.setAttribute('d',fio(b,0,1,0,0));r.base.style.opacity=1-prog;
    r.f1.setAttribute('d',p>.01?fio(b,0,p,6,r.fase):'');r.f2.setAttribute('d',p>.01?fio(b,Math.PI,p,6,r.fase):'');
    r.dots.forEach((c,j)=>{const s=(T*.28+j/3+i*.13)%1;
      if(p<.98){c.setAttribute('opacity',0);return}
      const [x,y]=cub(b,s);c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('opacity',Math.sin(Math.PI*s))});
  });
}

/* ---------- ciclo do cometa: 21 dias visível + 7 de intervalo ---------- */
const DUR=21,GAP=7;
const cv=document.getElementById('ceu'),cx=cv.getContext('2d'),hit=document.getElementById('hit');
let W,H;
function resize(){const d=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
const slider=document.getElementById('dia'),status=document.getElementById('status'),card=document.getElementById('card'),tempo=document.getElementById('tempo');
let dia=+slider.value,rodando=false,parts=[];
slider.oninput=()=>{dia=+slider.value};
document.getElementById('btnPlay').onclick=e=>{rodando=!rodando;e.target.textContent=rodando?'Pausar':'Acelerar tempo'};

function rota(s){ // s: 0 = direita, 1 = esquerda
  const p0=[W+40,H*.3],p1=[W*.5,H*.1],p2=[-40,H*.3],a=1-s;
  return[a*a*p0[0]+2*a*s*p1[0]+s*s*p2[0],a*a*p0[1]+2*a*s*p1[1]+s*s*p2[1]]}
function fmt(d){const ms=Math.max(0,d)*864e5,D=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return(D?D+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m'}
function cor(u,a){return u?`rgba(255,61,184,${a})`:`rgba(61,245,255,${a})`}

function frameCometa(dt){
  if(rodando){dia=(dia+dt*1.5)%(DUR+GAP);slider.value=dia}
  cx.clearRect(0,0,W,H);
  if(dia>=DUR){ // intervalo: sem cometa
    hit.style.display='none';card.classList.remove('show');parts=[];
    status.textContent='Céu limpo. Próximo cometa em '+fmt(DUR+GAP-dia);return}
  const resta=DUR-dia,u=resta<1,s=dia/DUR;
  status.textContent='Cometa Docker no céu. Some em '+fmt(resta);
  tempo.textContent=fmt(resta);card.classList.toggle('urg',u);
  let [x,y]=rota(s);
  const fade=Math.min(1,dia*4,resta*4); // entra e sai suave
  if(u){x+=(Math.random()-.5)*2.5;y+=(Math.random()-.5)*2.5}
  // cauda: segue a curva para trás (lado direito) e ondula
  const pts=[];for(let k=0;k<=30;k++){const ss=s-k*.006;const [px,py]=rota(Math.max(-.2,ss));
    pts.push([px+k*2.2,py+Math.sin(T*3+k*.35)*k*.35])}
  for(let k=1;k<pts.length;k++){const q=1-k/pts.length;
    cx.strokeStyle=cor(u,q*.8*fade);cx.lineWidth=q*10;cx.lineCap='round';
    cx.beginPath();cx.moveTo(pts[k-1][0],pts[k-1][1]);cx.lineTo(pts[k][0],pts[k][1]);cx.stroke()}
  if(!reduz)for(let i=0;i<2;i++)parts.push({x,y,vx:20+Math.random()*35,vy:(Math.random()-.5)*25,v:1});
  parts=parts.filter(p=>(p.v-=dt*.9)>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;cx.fillStyle=cor(u,p.v*.9*fade);cx.beginPath();cx.arc(p.x,p.y,1.6*p.v+.4,0,7);cx.fill()}
  const pul=26+Math.sin(T*4)*3,g=cx.createRadialGradient(x,y,0,x,y,pul);
  g.addColorStop(0,`rgba(255,255,255,${fade})`);g.addColorStop(.25,cor(u,.9*fade));g.addColorStop(1,cor(u,0));
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,pul,0,7);cx.fill();
  hit.style.display='block';hit.style.left=x+'px';hit.style.top=y+'px';
}
hit.onclick=()=>card.classList.add('show');
document.getElementById('fechar').onclick=()=>card.classList.remove('show');

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frameMapa(dt);frameCometa(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const legenda=document.getElementById('legenda');
document.getElementById('btnNexus').onclick=e=>{
  if(alvo===1){alvo=0;legenda.textContent='Conclua a ilha para abrir os portais';e.target.textContent='Concluir ilha Python';return}
  const f=document.getElementById('flash');f.classList.remove('go');stage.classList.remove('distorce');
  void f.offsetWidth;f.classList.add('go');stage.classList.add('distorce');
  setTimeout(()=>{alvo=1;legenda.textContent='Evento Nexus: novos portais se abriram'},300);
  e.target.textContent='Resetar';
};
</script>
</body>
</html>
