<title>Era da Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: mapa vertical de portais (mobile-first) + palco de jogo em tela cheia + gaveta do portfólio.
   Visual único e escuro (mesmo DNA do Jogo do Desenvolvedor): neon sobre quase-preto. */
:root{
  --bg:#05070d;--bg2:#0a0e1a;--panel:#0d1322;--panel2:#131b2e;--line:#1f2a44;
  --text:#eaf2ff;--muted:#8a9bbd;
  --html:#ff7a3d;--css:#3db8ff;--js:#ffe14d;
  --neon:#2dff8a;--violet:#c3a6ff;--pink:#ff6ad5;--gold:#ffcf40;
  --bad:#ff4d6d;--good:#2dff8a;
  --f-display:"Syne","Trebuchet MS",sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:0 60px;overflow-x:hidden;
  background-image:
    radial-gradient(800px 460px at 90% -10%,rgba(61,184,255,.13),transparent 60%),
    radial-gradient(640px 420px at -10% 30%,rgba(255,122,61,.10),transparent 60%),
    radial-gradient(640px 420px at 100% 80%,rgba(255,225,77,.06),transparent 60%),
    linear-gradient(rgba(61,184,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,184,255,.035) 1px,transparent 1px);
  background-size:auto,auto,auto,40px 40px,40px 40px;background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--css);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--css)}
code,.mono{font-family:var(--f-mono)}
.app{max-width:920px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding-block:12px;
  background:linear-gradient(var(--bg) 70%,transparent);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto;letter-spacing:-.01em}
.trio{display:flex;gap:3px}.trio i{width:8px;height:18px;border-radius:3px;display:block}
.trio i:nth-child(1){background:var(--html);box-shadow:0 0 10px var(--html)}
.trio i:nth-child(2){background:var(--css);box-shadow:0 0 10px var(--css)}
.trio i:nth-child(3){background:var(--js);box-shadow:0 0 10px var(--js)}
.chip{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip b{color:var(--text)}
button.chip:hover{border-color:var(--css);color:var(--text)}

/* botões */
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:1rem;background:linear-gradient(135deg,var(--css),#1a7fe0);color:#02101c;
  box-shadow:0 8px 26px -8px rgba(61,184,255,.8);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.btn.hot{background:linear-gradient(135deg,var(--html),#e2491b);color:#1c0700;box-shadow:0 8px 26px -8px rgba(255,122,61,.8)}
.btn.yel{background:linear-gradient(135deg,var(--js),#f2b600);color:#1c1500;box-shadow:0 8px 26px -8px rgba(255,225,77,.7)}
.btn.red{background:linear-gradient(135deg,#ff6b86,#d8173f);color:#fff;box-shadow:0 8px 26px -8px rgba(255,77,109,.8)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:9px}

/* Sintaxe */
.sx{width:74px;height:74px;flex:none;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,106,213,.45))}
.sx.big{width:120px;height:120px}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
.talk{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;min-width:0;flex:1;font-size:1rem}
.bubble .who{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:4px}
.bubble .caret{display:inline-block;width:8px;height:1em;background:var(--pink);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* intro */
.intro{display:grid;gap:22px;padding-block:28px 10px;max-width:640px;margin:0 auto}
.intro h1{font-size:clamp(2.3rem,8vw,3.8rem);font-weight:800;letter-spacing:-.03em}
.intro h1 span{display:block}
.intro h1 .g1{color:var(--html);text-shadow:0 0 22px rgba(255,122,61,.5)}
.intro h1 .g2{color:var(--css);text-shadow:0 0 22px rgba(61,184,255,.5)}
.intro h1 .g3{color:var(--js);text-shadow:0 0 22px rgba(255,225,77,.45)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.namebox{display:flex;gap:10px;flex-wrap:wrap}
.namebox input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-mono)}

/* mapa */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 6px;flex-wrap:wrap}
.sec-title h2{font-size:1.5rem;font-weight:800}
.sec-title .eyebrow{margin-left:auto}
.path{position:relative;padding-block:14px}
.path svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nodes{position:relative;display:grid;gap:18px}
.node{--c:var(--css);display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;width:max-content;max-width:70%}
.node:nth-child(4n+1){margin-left:4%}.node:nth-child(4n+2){margin-left:30%}.node:nth-child(4n+3){margin-left:52%}.node:nth-child(4n){margin-left:24%}
.portal{position:relative;width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center}
.portal::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--c),transparent 30%,var(--c) 55%,transparent 80%,var(--c));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);
  animation:spin 4s linear infinite;opacity:.9}
.portal::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 45%,transparent),var(--bg2) 70%);
  box-shadow:0 0 24px -4px var(--c),inset 0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}
.portal span{position:relative;z-index:1;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--text)}
.portal img,.portal svg{position:relative;z-index:1;width:46px;height:46px}
@keyframes spin{to{transform:rotate(360deg)}}
.node .lbl{min-width:0}
.node .lbl b{display:block;font-family:var(--f-display);font-size:1.02rem}
.node .lbl small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.node.lock{opacity:.38;cursor:not-allowed}
.node.lock .portal::before{animation:none;background:var(--line)}
.node.cur .portal{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.node.done .portal::before{animation-duration:9s}
.node.boss .portal{width:92px;height:92px}
.node.boss{--c:var(--bad)}
.node .tag{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}

/* luas */
.orbit{position:relative;height:350px;max-width:420px;margin:10px auto 0}
.planet{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2a3b66,#0b1020 70%);box-shadow:0 0 40px rgba(61,184,255,.35),inset -10px -10px 30px #000;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-align:center}
.ring{position:absolute;left:50%;top:50%;border:1px dashed var(--line);border-radius:50%;transform:translate(-50%,-50%)}
.moon{position:absolute;left:50%;top:50%;width:0;height:0;animation:orb var(--t) linear infinite;animation-delay:var(--d)}
.moon .arm{position:absolute;left:var(--r);top:0}
.moon button{position:absolute;left:-32px;top:-32px;width:64px;height:64px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 40%,#000) 75%);
  box-shadow:0 0 26px -2px var(--c);font-family:var(--f-mono);font-weight:700;font-size:.72rem;color:#05070d;
  animation:orb var(--t) linear infinite reverse;animation-delay:var(--d)}
.moon.lock button{filter:grayscale(1) brightness(.45);box-shadow:none;cursor:not-allowed}
.moon.done button{outline:2px solid var(--good);outline-offset:3px}
@keyframes orb{to{transform:rotate(360deg)}}
.moonlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.mcard{--c:var(--css);border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;text-align:left;display:grid;gap:4px}
.mcard b{font-family:var(--f-display);color:var(--c)}
.mcard small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.mcard.lock{opacity:.4;cursor:not-allowed}

/* ramificações */
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.branch{--c:var(--css);border:0;background:none;display:grid;justify-items:center;gap:8px;padding:10px;text-align:center}
.branch .portal{width:78px;height:78px}
.branch b{font-family:var(--f-display)}
.branch small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.branch.lock{opacity:.35}

/* estante de insígnias */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;gap:4px;text-align:center;padding:8px 4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.bdg svg{width:74px;height:74px}
.bdg small{font-size:.7rem;color:var(--muted);line-height:1.2}
.bdg.off svg{filter:grayscale(1) brightness(.3)}
.bdg.off small{opacity:.5}

/* palco */
.stage{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.stage-in{max-width:760px;margin:0 auto;display:grid;gap:14px}
.stage-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:10px;border-radius:9px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--html),var(--css),var(--js));transition:width .4s;box-shadow:0 0 12px var(--css)}
.hearts{font-size:1.1rem;letter-spacing:2px;color:var(--bad);font-family:var(--f-mono);white-space:nowrap}
.hearts .off{color:var(--line)}
.x{background:none;border:1px solid var(--line);border-radius:9px;width:36px;height:36px;color:var(--muted)}
.mission{display:grid;gap:4px}
.mission .eyebrow{color:var(--c,var(--css))}
.mission h3{font-size:1.3rem}
.timer{height:4px;border-radius:4px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--js);width:100%}
.arena{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--bg2);min-height:120px;overflow:hidden}
.hintbar{display:flex;gap:10px;align-items:center}
.hintbar .sx{width:44px;height:44px}
.hintbar .bubble{font-size:.92rem;padding:8px 12px}
.docl{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.docl a{color:var(--css)}

/* motor: ordenar */
.slots{min-height:64px;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px dashed var(--line)}
.slots.empty::before{content:"toque nas peças abaixo, na ordem certa";color:var(--muted);font-size:.85rem;font-family:var(--f-mono)}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.tok{font-family:var(--f-mono);font-size:.86rem;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 11px;transition:transform .1s;text-align:left}
.tok:hover{border-color:var(--css);transform:translateY(-2px)}
.tok.used{visibility:hidden}
.slots .tok{border-color:color-mix(in srgb,var(--css) 60%,var(--line));background:color-mix(in srgb,var(--css) 12%,var(--panel2))}
.slots.block{flex-direction:column;align-items:flex-start}

/* motor: classificar */
.sortcard{margin:18px auto;max-width:92%;text-align:center;font-family:var(--f-mono);font-size:1.15rem;padding:22px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 40px -20px #000}
.sortcard.in{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:0 12px 12px}
.bucket{--c:var(--css);border:1.5px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:12px;padding:14px 8px;font-weight:700;font-size:.92rem}
.bucket small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding:10px 12px 0;display:flex;justify-content:space-between}

/* motor: pegar */
.catch{height:360px;touch-action:manipulation}
.fall{position:absolute;top:0;left:0;font-family:var(--f-mono);font-size:.95rem;font-weight:700;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);white-space:nowrap;user-select:none;will-change:transform}
.fall.hit{border-color:var(--good);color:var(--good);animation:burst .35s forwards}
.fall.miss{border-color:var(--bad);color:var(--bad);animation:burst .35s forwards}
@keyframes burst{to{opacity:0;scale:1.6}}

/* motor: bug */
.lines{font-family:var(--f-mono);font-size:.86rem;padding:10px 0;overflow-x:auto}
.ln{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:7px 12px;white-space:pre;color:var(--text)}
.ln i{font-style:normal;color:var(--muted);min-width:1.5em;text-align:right;user-select:none}
.ln:hover{background:var(--panel2)}
.ln.found{background:rgba(45,255,138,.12);color:var(--good)}
.ln.wrong{animation:shake .3s;background:rgba(255,77,109,.15)}
.ln.found::after{content:"  ✓ bug";color:var(--good)}

/* motor: código */
.codewrap{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:720px){.codewrap{grid-template-columns:1fr 1fr}}
.editor{font-family:var(--f-mono);font-size:.9rem;min-height:190px;width:100%;resize:vertical;background:#070a12;color:#d9f3ff;border:0;border-right:1px solid var(--line);padding:12px;line-height:1.55;tab-size:2;outline:none}
.preview{background:#fff;width:100%;min-height:190px;border:0;display:block}
.keys{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.keys button{font-family:var(--f-mono);font-size:.85rem;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 10px;min-width:36px}
.status{font-family:var(--f-mono);font-size:.82rem;padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}
.status.ok{color:var(--good)}

/* motor: ajustar */
.tunebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.tunebox .lab{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tunebox .scene{position:relative;height:170px;border-radius:12px;background:#0b1120;border:1px solid var(--line);overflow:hidden}
.tunebox .scene.target{border-style:dashed;opacity:.85}
.ctrls{display:grid;gap:8px;padding:0 12px 12px}
.ctrl{display:grid;gap:4px}
.ctrl label{font-family:var(--f-mono);font-size:.78rem;color:var(--css)}
.ctrl .opts{display:flex;flex-wrap:wrap;gap:5px}
.ctrl .opts button{font-family:var(--f-mono);font-size:.76rem;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 9px}
.ctrl .opts button.on{border-color:var(--css);background:color-mix(in srgb,var(--css) 22%,var(--panel2));color:#fff}
.ctrl .opts button.ok{border-color:var(--good)}

/* feedback */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(140%);z-index:90;
  background:var(--panel);border:1px solid var(--good);color:var(--good);border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:80;opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{20%{opacity:.25}}

/* recompensa */
.reward{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:20px}
.reward .medal{width:180px;height:180px;animation:drop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{from{transform:translateY(-60px) scale(.3) rotate(-30deg);opacity:0}}
.reward h2{font-size:1.8rem}
.rays{position:relative;display:grid;place-items:center}
.rays::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c,var(--css)) 35%,transparent) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 12s linear infinite}
.xpup{font-family:var(--f-mono);color:var(--js)}

/* chefe */
.bossbar{display:grid;gap:6px}
.bossbar .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.8rem}
.hp{height:14px;border-radius:9px;background:var(--panel2);overflow:hidden;border:1px solid #3a1420}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff7a3d);transition:width .5s;box-shadow:0 0 16px #ff2d55}
.boss-face{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;color:var(--bad);text-shadow:0 0 18px var(--bad),3px 0 var(--css),-3px 0 var(--html);animation:glitch 1.8s infinite steps(1);text-align:center}
@keyframes glitch{10%{transform:translate(2px,-1px)}12%{transform:none}50%{transform:translate(-3px,1px) skewX(8deg)}52%{transform:none}}
.boss-face.hurt{animation:shake .35s}

/* gaveta portfólio */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.72);display:grid;place-items:end center}
.drawer .sheet{width:100%;max-width:880px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:12px}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.browser .bar{background:#1a2238;display:flex;gap:6px;align-items:center;padding:8px 10px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.browser .bar i+i{background:#febc2e}.browser .bar i+i+i{background:#28c840}
.browser .bar span{margin-left:8px;background:#0d1322;border-radius:6px;padding:3px 10px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.browser iframe{width:100%;height:420px;border:0;display:block}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{font-family:var(--f-mono);font-size:.72rem;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.piece.on{border-color:var(--good);color:var(--good)}
pre.src{margin:0;max-height:220px;overflow:auto;background:#070a12;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.75rem;color:#bfe6ff}

.foot{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.foot button{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.story{border-left:2px solid var(--pink);padding-left:12px;color:var(--muted);font-size:.95rem;max-width:62ch}

/* diálogo por toque */
.bubble[role=button]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bubble .more{display:block;margin-top:8px;font-family:var(--f-mono);font-size:.74rem;color:var(--pink);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px);opacity:.6}}
.introgo{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* timer: vermelho e pulsando nos últimos 30% */
.timer i{transition:width .1s linear}
.timer i.low{background:var(--bad);animation:tpulse .5s ease-in-out infinite;box-shadow:0 0 12px var(--bad)}
@keyframes tpulse{50%{opacity:.35}}
/* acerto = brilho neon; erro = tremida */
.arena{transition:box-shadow .3s,border-color .3s}
.arena.glow{border-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 30px -4px var(--good)}
.hearts.shake{display:inline-block}
/* blocos e lacuna */
pre.ctx,pre.fillcode{margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:.86rem;color:#bfe6ff;background:#070a12;white-space:pre-wrap;word-break:break-word;font-variant-ligatures:none}
pre.fillcode{border-bottom:1px solid var(--line);font-size:.95rem;line-height:1.6}
.gap{display:inline-block;min-width:3.5em;padding:0 6px;border-radius:6px;border:1.5px dashed var(--pink);color:var(--pink);text-align:center}
.gap.ok{border-style:solid;border-color:var(--good);color:var(--good);box-shadow:0 0 14px -2px var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.chips.three{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:520px){.chips.three{grid-template-columns:repeat(3,1fr)}}
.tok{min-height:44px;font-variant-ligatures:none}
.tok.good{border-color:var(--good);color:var(--good);box-shadow:0 0 16px -2px var(--good)}
.tok.bad{border-color:var(--bad);color:var(--bad);opacity:.55}
.tabbar{display:flex;align-items:center;gap:8px;background:#1a2238;padding:6px 10px;font-family:var(--f-mono);font-size:.78rem;color:var(--text);border-top:1px solid var(--line)}
.tabbar i{width:10px;height:10px;border-radius:50%;background:var(--css);box-shadow:0 0 8px var(--css)}
.tabbar span{background:var(--panel);border-radius:8px 8px 0 0;padding:4px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* interrogatório */
.avt{display:grid}
.avt .eyebrow{padding:10px 12px 0;color:var(--bad)}
.avt .q{padding:12px 12px 0;font-weight:700;font-size:1.05rem}
/* poda */
.snips{display:grid;gap:8px;padding:12px}
.snip{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;min-height:48px;color:var(--text)}
.snip code{font-family:var(--f-mono);font-size:.86rem;white-space:pre-wrap;word-break:break-word;font-variant-ligatures:none}
.snip .cut{color:var(--pink);font-size:1.1rem}
.snip:hover{border-color:var(--pink)}
.snip.wrong{animation:shake .3s;border-color:var(--bad)}
.snip.cutdone{border-color:var(--good);color:var(--good);text-decoration:line-through;opacity:.6}
/* desarme */
.bomb{display:grid;justify-items:center;gap:2px;padding:12px 12px 0}
.bomb b{font-family:var(--f-mono);font-size:2.2rem;color:var(--js);text-shadow:0 0 16px var(--js)}
.bomb b.hot{color:var(--bad);text-shadow:0 0 18px var(--bad);animation:tpulse .5s ease-in-out infinite}
.bomb small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
/* portal instável: o anel encolhe com o tempo (--tf vai de 1 a 0) */
.portalbox{position:relative;height:96px;display:grid;place-items:center;border-bottom:1px dashed var(--line)}
.pring{width:78px;height:78px;border-radius:50%;transform:scale(calc(.25 + var(--tf,1) * .75));transition:transform .1s linear;
  background:conic-gradient(from 0deg,var(--c),transparent 30%,var(--c) 55%,transparent 80%,var(--c));
  -webkit-mask:radial-gradient(circle,transparent 55%,#000 58%);mask:radial-gradient(circle,transparent 55%,#000 58%);animation:spin 1.6s linear infinite;box-shadow:0 0 30px -6px var(--c)}
.portalbox span{position:absolute;bottom:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
svg .lg-rays{transform-box:view-box;transform-origin:50% 50%;animation:spin 16s linear infinite}
svg .lg-shine{animation:shine 2.8s ease-in-out infinite}
@keyframes shine{from{transform:skewX(-20deg) translateX(0)}60%,to{transform:skewX(-20deg) translateX(220px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media(max-width:480px){.node:nth-child(4n+2){margin-left:18%}.node:nth-child(4n+3){margin-left:30%}.node:nth-child(4n){margin-left:12%}}

function gemPts(n, r, rot = -90, cx = 50, cy = 50) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = (rot + i * 360 / n) * Math.PI / 180; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return p;

  ${under}
  <polygon points="${ptsStr(outer)}" fill="url(#${id})" stroke="${c1}" stroke-width="1.5"/>

const TYPE_MS = 32;
function typeInto(el, text, cb){
  let i = 0; clearTimeout(el._t); el.textContent = ''; const caret = document.createElement('span'); caret.className = 'caret';
  const end = () => { el._typing = false; cb && cb(); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; el.appendChild(caret); end(); el._skip = () => {}; return; }
  el._typing = true;
  const tick = () => { el.textContent = text.slice(0, ++i); el.appendChild(caret); if (i < text.length) el._t = setTimeout(tick, TYPE_MS); else end(); };
  el._skip = () => { if (!el._typing) return; clearTimeout(el._t); el.textContent = text; el.appendChild(caret); end(); };
  tick();
}
/* Falas que só avançam com toque/clique (ou Enter/Espaço). Tocar enquanto digita mostra a fala inteira. */
function dialog(talkEl, lines, onDone){
  const bub = talkEl.querySelector('.bubble'), say = talkEl.querySelector('.say'), more = talkEl.querySelector('.more');
  let i = 0, finished = false;
  const next = () => { more.hidden = true; const last = i === lines.length - 1;
    typeInto(say, lines[i++], () => { if (last) { if (!finished) { finished = true; onDone && onDone(); } } else more.hidden = false; }); };
  const tap = () => { if (say._typing) say._skip(); else if (i < lines.length) next(); };
  bub.addEventListener('click', tap);
  bub.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
  next();
}

  return `As três luas brilham. O <b>Evento Nexus</b> abriu as Ramificações!`;
}

function portalNode(o){
  return `<button class="node ${o.cls}" style="--c:${o.c}" data-go="${o.go}" ${o.lock ? 'aria-disabled="true"' : ''}>
    <span class="portal">${o.inner}</span>
    <span class="lbl"><span class="tag">${o.tag}</span><b>${o.title}</b><small>${o.small}</small></span></button>`;
}

function renderMap(){
  const n = eraDone();
  const eraNodes = ERA.map((t, i) => {
    const lock = !eraUnlocked(i), done = !!S.done[t.id], cur = !lock && !done;
    return portalNode({ cls:(lock ? 'lock' : '') + (done ? ' done' : '') + (cur ? ' cur' : ''), c:t.c, go:'t:' + i, lock,
      inner: done ? badgeSVG({ ...t, name:t.badge }) : `<span>${String(i + 1).padStart(2, '0')}</span>`,
      tag:t.year, title:t.t, small: done ? 'insígnia: ' + t.badge : (lock ? 'bloqueada' : t.rounds.length + ' missões · +' + (t.rounds.length * 10 + 50) + ' xp') });
  }).join('');
  const bl = !bossUnlocked();
  const bossNode = portalNode({ cls:'boss ' + (bl ? 'lock' : '') + (S.done.boss ? ' done' : ' cur'), c:'#ff4d6d', go:'boss', lock:bl,
    inner:`<span style="color:#ff4d6d;font-size:1rem">ECO</span>`, tag:'chefe da era', title:'Eco', small: S.done.boss ? 'derrotado' : (bl ? 'termine as 10 trilhas' : 'insígnia rara + lendária') });

  const moonsOpen = !!S.done.boss;
  const moons = MOONS.map((m, i) => `<div class="moon ${moonsOpen ? '' : 'lock'} ${moonDone(m) ? 'done' : ''}" style="--c:${m.c};--r:${m.r};--t:${m.t};--d:-${i * 7}s"><div class="arm"><button data-moon="${m.id}" aria-label="${m.name}">${m.short}</button></div></div>`).join('');
  const rings = MOONS.map(m => `<div class="ring" style="width:calc(${m.r} * 2);height:calc(${m.r} * 2)"></div>`).join('');

  let moonPanel = '';

  if (moonsOpen && sel) {
    const nodes = sel.trails.map((t, i) => { const lock = i > 0 && !S.done[sel.trails[i - 1].id], done = !!S.done[t.id];
      return portalNode({ cls:(lock ? 'lock' : '') + (done ? ' done' : '') + (!lock && !done ? ' cur' : ''), c:sel.c, go:'m:' + sel.id + ':' + i, lock,
        inner:`<svg viewBox="0 0 100 100">${ICON[t.icon]}</svg>`, tag:sel.short + ' · trilha ' + (i + 1), title:t.t, small: done ? 'concluída' : (lock ? 'bloqueada' : t.rounds.length + ' missões') }); }).join('');
    const bl2 = !sel.trails.every(t => S.done[t.id]);
    const bossN = portalNode({ cls:'boss ' + (bl2 ? 'lock' : '') + (moonDone(sel) ? ' done' : ' cur'), c:sel.c, go:'mb:' + sel.id, lock:bl2,
      inner: moonDone(sel) ? badgeSVG(sel.excl) : `<span style="color:${sel.c}">${esc(sel.boss.face)}</span>`, tag:'chefe da lua', title:sel.boss.name, small:'insígnia exclusiva: ' + sel.excl.name });
    moonPanel = `<div class="sec-title"><h2 style="color:${sel.c}">${sel.name}</h2><span class="eyebrow">5 trilhas + chefe</span></div><div class="path"><div class="nodes">${nodes}${bossN}</div></div>`;
  }

  const bOpen = moonsAllDone();
  const branches = BRANCHES.map(b => `<button class="branch ${bOpen && !b.future ? '' : 'lock'}" style="--c:${b.c}" data-branch="${b.id}">
    <span class="portal"><span style="font-size:.7rem">${esc(b.name.slice(0, 5))}</span></span><b>${b.name}</b><small>${b.since}${b.parent ? ' · ramo do React' : ''}${b.future ? ' · Era do Back-end' : ''}</small></button>`).join('');

  const allBadges = [...ERA.map(t => ({ ...t, name:t.badge, key:t.id })), { ...SPECIAL.rara, key:'rara' }, { ...SPECIAL.lendaria, key:'lendaria' }, ...MOONS.map(m => ({ ...m.excl, key:m.id + '_excl' }))];
  const shelf = allBadges.map(b => `<div class="bdg ${S.badges[b.key] ? '' : 'off'}">${badgeSVG(b)}<small>${esc(b.name)}${b.tier === 'rara' ? '<br><b style="color:var(--violet)">RARA</b>' : b.tier === 'lendaria' ? '<br><b style="color:var(--gold)">LENDÁRIA</b>' : b.tier === 'lua' ? '<br><b style="color:var(--css)">EXCLUSIVA</b>' : ''}</small></div>`).join('');

  app.innerHTML = `
  <header class="hud"><div class="brand"><span class="trio"><i></i><i></i><i></i></span>Era da Web</div>
    <span class="chip">xp <b id="xp">${S.xp}</b></span>
    <button class="chip" data-scroll="shelf">insígnias <b>${Object.keys(S.badges).length}/${allBadges.length}</b></button>
    <button class="chip" data-pf>portfólio <b>${n * 10}%</b></button></header>
  ${talk(storyLine())}
  <div class="sec-title"><h2>Trilhas da Era</h2><span class="eyebrow">${n}/10 · HTML · CSS · JS</span></div>
  <div class="path" id="erapath"><svg class="links"></svg><div class="nodes">${eraNodes}${bossNode}</div></div>

  <div class="sec-title"><h2>Luas</h2><span class="eyebrow">${moonsOpen ? 'toque numa lua' : 'nascem ao vencer o Eco'}</span></div>
  <div class="orbit"><div class="planet">WEB<br>${moonsOpen ? '✓' : 'ECO'}</div>${rings}${moons}</div>
  ${moonPanel}

  <div class="sec-title"><h2>Ramificações</h2><span class="eyebrow">${bOpen ? 'Evento Nexus ativo' : 'após as 3 luas'}</span></div>
  <div class="branches">${branches}</div>

  <div class="sec-title" id="shelf"><h2>Estante de insígnias</h2></div>
  <div class="shelf">${shelf}</div>

  <div class="foot"><span>salvo neste navegador</span><button id="cheat">liberar tudo (teste)</button><button id="reset">recomeçar</button></div>`;
  drawLinks();
}

function drawLinks(){
  const path = $('#erapath'); if (!path) return;
  const svg = $('svg.links', path), box = path.getBoundingClientRect();
  const pts = [...path.querySelectorAll('.node .portal')].map(p => { const r = p.getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; });
  let d = '', dd = '';
  const doneCount = eraDone();
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2;
    const seg = `M${x0},${y0} C${x0},${my} ${x1},${my} ${x1},${y1}`;
    if (i <= doneCount) dd += seg; else d += seg;
  }
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#1f2a44" stroke-width="3" stroke-dasharray="4 8"/>
    <path d="${dd}" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" repeatCount="indefinite"/></path>
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a3d"/><stop offset=".5" stop-color="#3db8ff"/><stop offset="1" stop-color="#ffe14d"/></linearGradient></defs>`;
}
addEventListener('resize', () => drawLinks());
document.fonts && document.fonts.ready.then(() => drawLinks());

app.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');

    if (v.startsWith('t:')) { const t = ERA[+v.slice(2)]; runStage({ kind:'trail', title:t.t, c:t.c, say:t.say, rounds:t.rounds, doc:t.doc, trail:t }); }
    else if (v === 'boss') runStage({ kind:'boss', title:ERA_BOSS.name, c:ERA_BOSS.c, say:ERA_BOSS.say, rounds:ERA_BOSS.rounds, boss:ERA_BOSS });
    else if (v.startsWith('m:')) { const [, mid, i] = v.split(':'); const m = MOONS.find(x => x.id === mid), t = m.trails[+i];
      runStage({ kind:'moon', title:t.t, c:m.c, say:t.say, rounds:t.rounds, doc:{ label:'MDN · ' + t.t, url:t.doc }, trail:t, moon:m }); }
    else if (v.startsWith('mb:')) { const m = MOONS.find(x => x.id === v.slice(3));
      runStage({ kind:'moonboss', title:m.boss.name, c:m.c, say:m.boss.say, rounds:m.bossRounds, boss:{ name:m.boss.name, face:m.boss.face }, moon:m }); }
    return; }
  const mo = e.target.closest('[data-moon]');
  if (mo) { if (!S.done.boss) { toast('As luas nascem quando o Eco cair.', true); return; } S.moon = S.moon === mo.dataset.moon ? null : mo.dataset.moon; save(); renderMap();
    setTimeout(() => $('.orbit')?.nextElementSibling?.scrollIntoView({ behavior:'smooth', block:'start' }), 50); return; }
  const br = e.target.closest('[data-branch]'); if (br) return openBranch(BRANCHES.find(b => b.id === br.dataset.branch));
  if (e.target.closest('[data-pf]')) return openPortfolio();
  const sc = e.target.closest('[data-scroll]'); if (sc) return $('#' + sc.dataset.scroll).scrollIntoView({ behavior:'smooth' });
  if (e.target.id === 'cheat') { ERA.forEach(t => { S.done[t.id] = 1; S.badges[t.id] = 1; }); S.pf.name = S.pf.name || S.name; S.done.boss = 1; S.badges.rara = 1; S.badges.lendaria = 1;
    MOONS.forEach(m => { m.trails.forEach(t => S.done[t.id] = 1); S.done[m.id + '_boss'] = 1; S.badges[m.id + '_excl'] = 1; }); save(); renderMap(); toast('Tudo liberado (modo teste)'); }
  if (e.target.id === 'reset') { if (e.target.dataset.sure) { S = fresh(); save(); render(); } else { e.target.dataset.sure = 1; e.target.textContent = 'toque de novo para apagar tudo'; } }
});

function openBranch(b){
  const open = moonsAllDone() && !b.future;
  const dr = document.createElement('div'); dr.className = 'drawer';
  dr.innerHTML = `<div class="sheet" style="--c:${b.c}"><div style="display:flex;align-items:center;gap:10px"><h2 style="font-size:1.4rem;color:${b.c};margin-right:auto">${b.name}</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
  ${talk(b.future ? 'Node.js leva o JS ao servidor. Próxima era: Back-end!' : open ? `Evento Nexus! O portal do ${b.name} está se formando.` : 'Esse portal abre quando as três luas caírem.')}

/* ===================== PALCO (runner) ===================== */
/* Dificuldade da etapa (0 = começo da era, 1 = chefes de lua): o tempo começa 50% maior e a
   pressão cresce aos poucos, fase a fase. */
function stageDifficulty(cfg){
  if (cfg.kind === 'trail') return ERA.indexOf(cfg.trail) / (ERA.length - 1) * 0.7;
  if (cfg.kind === 'boss') return 0.85;
  if (cfg.kind === 'moon') return 0.6;
  return 1;
}
let STAGE = null;
function runStage(cfg){
  const isBoss = cfg.kind === 'boss' || cfg.kind === 'moonboss';
  const st = document.createElement('div'); st.className = 'stage'; st.style.setProperty('--c', cfg.c);
  document.body.appendChild(st); document.body.style.overflow = 'hidden';
  const d = stageDifficulty(cfg);
  const run = { cfg, i:0, hearts:3, lost:0, hp:cfg.rounds.length, cleanup:null, timer:null, fails:0, d, scale:1.5 - 0.5 * d };
  STAGE = run;
  const close = () => { stopRound(); st.remove(); document.body.style.overflow = ''; STAGE = null; renderMap(); };
  const stopRound = () => { run.cleanup && run.cleanup(); run.cleanup = null; clearInterval(run.timer); };

  const shell = inner => {
    st.innerHTML = `<div class="stage-in">
      <div class="stage-top"><button class="x" data-x aria-label="Sair">✕</button><div class="prog"><i style="width:${run.i / cfg.rounds.length * 100}%"></i></div>
      <span class="hearts" aria-label="${run.hearts} vidas">${[0, 1, 2].map(k => `<span class="${k < run.hearts ? '' : 'off'}">♥</span>`).join('')}</span></div>
      ${isBoss ? `<div class="bossbar"><div class="boss-face" id="bf">${esc(cfg.boss.face)}</div><div class="top"><b style="color:var(--bad)">${esc(cfg.boss.name)}</b><span>${run.hp}/${cfg.rounds.length}</span></div><div class="hp"><i style="width:${run.hp / cfg.rounds.length * 100}%"></i></div></div>` : ''}
      ${inner}</div>`;
    st.querySelector('[data-x]').onclick = close;
  };

  // intro: as falas só avançam com toque; o botão aparece no fim (o timer ainda não existe aqui).
  shell(`<div class="mission"><span class="eyebrow">${isBoss ? 'batalha' : 'portal'}</span><h3>${esc(cfg.title)}</h3></div>${talk('')}
    <div class="introgo" hidden><button class="btn ${isBoss ? 'red' : 'hot'}" id="go">${isBoss ? 'Lutar!' : 'Bora!'}</button>
    ${cfg.doc ? `<span class="docl">doc · <a href="${cfg.doc.url}" target="_blank" rel="noopener">${esc(cfg.doc.label)}</a></span>` : ''}</div>`);
  dialog(st.querySelector('.talk'), cfg.say, () => { const g = st.querySelector('.introgo'); g.hidden = false; st.querySelector('#go').focus(); });
  st.querySelector('#go').onclick = () => startRound();

  function startRound(){
    stopRound();
    const r = cfg.rounds[run.i];
    const time = r.time ? Math.round(r.time * run.scale) : 0;
    shell(`<div class="mission"><span class="eyebrow">missão ${run.i + 1}/${cfg.rounds.length}${time ? ' · ' + time + 's' : ''}</span><h3>${esc(r.title)}</h3><p style="color:var(--muted)">${esc(r.sub)}</p></div>
      ${time ? '<div class="timer"><i id="tm"></i></div>' : ''}
      <div class="arena" id="arena"></div>
      <div class="hintbar" id="hb" ${run.fails ? '' : 'hidden'}>${sintaxe()}<div class="bubble">${esc(r.hint ? 'Dica: ' + r.hint : 'Respira. Você tem mais uma chance!')}</div></div>`);
    const arena = st.querySelector('#arena');
    let over = false;
    const api = {
      win(){ if (over) return; over = true; stopRound(); roundWon(); },
      fail(msg){ if (over) return; over = true; stopRound(); roundFailed(msg); },
      err(el){ flash('#ff4d6d'); sfx('bad'); shakeEl(el || arena); if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {} },
      ok(){ flash('#2dff8a'); sfx('good'); arena.classList.remove('glow'); void arena.offsetWidth; arena.classList.add('glow'); },
      hint(){ st.querySelector('#hb').hidden = false; }
    };
    // O motor monta o desafio; só depois o timer começa (nunca durante o diálogo).
    run.cleanup = ENGINES[r.type](r, arena, api, run) || null;
    if (time) { const t0 = Date.now(), bar = st.querySelector('#tm');
      st.style.setProperty('--tf', 1);
      run.timer = setInterval(() => { const f = Math.max(0, 1 - (Date.now() - t0) / (time * 1000)); bar.style.width = f * 100 + '%';
        bar.classList.toggle('low', f < .3); st.style.setProperty('--tf', f); if (f <= 0) api.fail(r.timeout || 'Tempo esgotado!'); }, 100); }
  }

  function roundWon(){
    run.fails = 0; addXP(10); toast(['Boa!', 'Mandou bem!', 'Isso aí!', 'Perfeito!'][Math.random() * 4 | 0] + ' +10 xp');
    if (isBoss) { run.hp--; const f = st.querySelector('#bf'); if (f) { f.classList.add('hurt'); } const hp = st.querySelector('.hp i'); if (hp) hp.style.width = run.hp / cfg.rounds.length * 100 + '%'; }
    run.i++;
    setTimeout(() => run.i >= cfg.rounds.length ? finish() : startRound(), 850);
  }
  function roundFailed(msg){
    run.hearts--; run.lost++; run.fails++; toast(msg || 'Ops!', true); flash('#ff4d6d'); sfx('bad'); shakeEl(st.querySelector('.hearts'));
    if (run.hearts <= 0) return setTimeout(gameOver, 700);
    setTimeout(startRound, 900);
  }
  function gameOver(){
    shell(`<div class="reward">${sintaxe('big')}<h2>A linha do tempo ramificou!</h2><p style="color:var(--muted)">O ${isBoss ? esc(cfg.boss.name) : 'Eco'} levou essa. Seus pontos ficam, a trilha recomeça.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn hot" id="again">Tentar de novo</button><button class="btn ghost" data-x2>Voltar ao mapa</button></div></div>`);
    st.querySelector('#again').onclick = () => { run.i = 0; run.hearts = 3; run.lost = 0; run.hp = cfg.rounds.length; run.fails = 0; startRound(); };
    st.querySelector('[data-x2]').onclick = close;
  }
  function finish(){
    let medals = [], title = '', line = '', extra = '';
    if (cfg.kind === 'trail') { const t = cfg.trail; S.done[t.id] = 1; S.badges[t.id] = 1; addXP(50);
      medals = [{ ...t, name:t.badge }]; title = t.badge; line = 'Peça do portfólio liberada: ' + t.pieceName + '.'; }
    if (cfg.kind === 'boss') { S.done.boss = 1; S.badges.rara = 1; addXP(200); medals = [SPECIAL.rara]; title = 'Eco derrotado!';
      if (run.lost === 0) { S.badges.lendaria = 1; medals.push(SPECIAL.lendaria); line = 'Sem perder uma vida. Insígnia LENDÁRIA!'; }
      else line = `Você perdeu ${run.lost} vida(s). Vença sem perder nenhuma para a lendária.`;
      extra = '<p class="story">O Eco caiu! Os fragmentos da Web viraram três luas: HTML, CSS e JS.</p>'; }
    if (cfg.kind === 'moon') { S.done[cfg.trail.id] = 1; addXP(40); title = cfg.trail.t + ' concluída'; line = '+40 xp. Siga até o chefe da lua.'; }
    if (cfg.kind === 'moonboss') { const m = cfg.moon; S.done[m.id + '_boss'] = 1; S.badges[m.id + '_excl'] = 1; addXP(150); medals = [m.excl]; title = m.excl.name; line = 'Insígnia exclusiva da ' + m.name + '!';
      if (moonsAllDone()) extra = '<p class="story">As três luas se alinharam. EVENTO NEXUS: as Ramificações abriram!</p>'; }
    save(); sfx('win');
    const c = medals[0]?.tier === 'lendaria' || medals[1] ? 'var(--gold)' : cfg.c;
    shell(`<div class="reward" style="--c:${c}">
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${medals.map(m => `<div class="rays"><div class="medal">${badgeSVG(m)}</div></div>`).join('') || sintaxe('big')}</div>
      <p class="eyebrow">${medals.length ? 'nova insígnia' : 'trilha concluída'}</p><h2>${esc(title)}</h2>
      <p class="xpup">${esc(line)}</p>${extra}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        ${cfg.kind === 'trail' || cfg.kind === 'boss' ? '<button class="btn" id="seepf">Ver meu portfólio</button>' : ''}
        <button class="btn ghost" data-x2>Voltar ao mapa</button></div></div>`);
    st.querySelector('[data-x2]').onclick = close;
    const sp = st.querySelector('#seepf'); if (sp) sp.onclick = () => { close(); openPortfolio(); };
  }
}

/* ===================== PRÉVIA E FEEDBACK ===================== */
/* Troca {NAME} pelo nome do viajante e {USER} pelo apelido sem espaço. */
const slug = s => String(s || 'voce').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '') || 'voce';
const tpl = s => String(s ?? '').replace(/\{NAME\}/g, S.name || 'Seu Nome').replace(/\{USER\}/g, slug(S.name));
/* Documento da prévia ao vivo: HTML direto; CSS sobre o HTML da missão; JS com console.log visível. */
function buildSrc(r, src){
  const base = '<style>body{font-family:system-ui,sans-serif;margin:12px;color:#111}</style>';
  if (r.lang === 'html') return base + src;
  if (r.lang === 'css') return base + tpl(r.html || '') + '<style>' + src + '</style>';
  const shim = 'window.__err=null;window.onerror=function(m){window.__err=m;return true};' +
    'console.log=function(){var p=document.createElement("pre");p.style.cssText="margin:4px 0;font:15px monospace;color:#0a7b4f";' +
    'p.textContent="> "+[].map.call(arguments,function(a){return typeof a==="string"?a:JSON.stringify(a)}).join(" ");(document.body||document.documentElement).appendChild(p)};';
  return base + tpl(r.html || '') + '<script>' + shim + SC + '<script>' + src + '\n' + SC;
}
function shakeEl(el){ if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
/* Sons curtos (Web Audio): acerto sobe, erro desce. Silencioso se o navegador não deixar. */
let _ac = null;
function sfx(kind){
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { good:[660, 990], bad:[220, 150], win:[523, 659, 784] }[kind] || [440];
    notes.forEach((f, k) => { const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime + k * .09;
      o.type = kind === 'bad' ? 'square' : 'triangle'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.connect(g).connect(_ac.destination); o.start(t); o.stop(t + .18); });
  } catch (e) {}
}

/* ===================== MOTORES DE MISSÃO ===================== */
const ENGINES = {
  /* toque as peças na ordem certa: acerto encaixa, erro treme */
  order(r, el, api){
    const pool = shuffle([...r.tokens, ...(r.extra || [])].map((t, i) => ({ t, i })));
    let pos = 0, errs = 0;
    el.innerHTML = `<div class="slots empty ${r.block ? 'block' : ''}" id="sl"></div><div class="pool">${pool.map((p, k) => `<button class="tok" data-k="${k}">${esc(p.t)}</button>`).join('')}</div>
      ${r.preview ? '<iframe class="preview" style="min-height:120px;border-top:1px solid var(--line)" title="Prévia"></iframe>' : ''}<div class="score"><span>erros <b id="er">0/3</b></span><span id="pg">0/${r.tokens.length}</span></div>`;
    const sl = el.querySelector('#sl'), fr = el.querySelector('iframe');
    el.querySelector('.pool').addEventListener('click', e => {
      const b = e.target.closest('.tok'); if (!b) return; const p = pool[+b.dataset.k];
      if (p.t === r.tokens[pos]) { pos++; b.classList.add('used'); sl.classList.remove('empty'); const s = document.createElement('span'); s.className = 'tok'; s.textContent = p.t; sl.appendChild(s);
        el.querySelector('#pg').textContent = pos + '/' + r.tokens.length;
        if (fr) fr.srcdoc = '<style>body{font-family:system-ui;margin:10px}</style>' + r.tokens.slice(0, pos).join('');
        sfx('good'); if (pos === r.tokens.length) { api.ok(); api.win(); } }
      else { errs++; el.querySelector('#er').textContent = errs + '/3'; api.err(b); if (errs >= 3) api.fail('Ordem errada 3 vezes'); }
    });
  },
  /* classificar em baldes, uma carta por vez */
  sort(r, el, api){
    const q = shuffle(r.items); let k = 0, errs = 0, max = r.maxErr || 3;
    el.innerHTML = `<div class="score"><span>erros <b id="er">0/${max}</b></span><span id="pg">0/${q.length}</span></div><div class="sortcard in" id="card"></div>
      <div class="buckets">${r.buckets.map(b => `<button class="bucket" style="--c:${b.c}" data-b="${b.id}">${esc(b.label)}${b.s ? `<small>${esc(b.s)}</small>` : ''}</button>`).join('')}</div>`;
    const card = el.querySelector('#card');
    const show = () => { card.textContent = q[k][0]; card.classList.remove('in'); void card.offsetWidth; card.classList.add('in'); };
    show();
    el.querySelector('.buckets').addEventListener('click', e => {
      const b = e.target.closest('.bucket'); if (!b || k >= q.length) return;
      if (b.dataset.b === q[k][1]) { k++; el.querySelector('#pg').textContent = k + '/' + q.length; if (k >= q.length) { api.ok(); return api.win(); } show(); }
      else { errs++; el.querySelector('#er').textContent = errs + '/' + max; api.err(card); if (errs >= max) api.fail('Muitos erros de classificação'); }
    });
  },
  /* chuva: toque só nos certos. Começa devagar e acelera a cada acerto; poucas palavras por vez no começo. */
  catch(r, el, api, run){
    const max = r.maxErr || 3, d = run ? run.d : .5; let got = 0, errs = 0, raf, last = 0, spawnAt = 0, items = [], alive = true;
    const onScreen = d < .35 ? 2 : d < .75 ? 3 : 4;     // nunca mais de 2 nas fases iniciais
    const base = 40 + d * 36;                           // px/s no primeiro item (devagar)
    const step = 3 + d * 5;                             // acelera a cada acerto
    el.classList.add('catch');
    el.innerHTML = `<div class="score" style="position:absolute;inset:0 0 auto;z-index:2;pointer-events:none"><span>erros <b id="er">0/${max}</b></span><span>pegos <b id="pg">0/${r.need}</b></span></div>`;
    const H = () => el.clientHeight, W = () => el.clientWidth;
    const spawn = () => {
      // Se nenhuma palavra certa está na tela, a próxima é certa: o jogador nunca fica só esperando.
      const good = !items.some(i => !i.dead && i.d.dataset.g === '1') || Math.random() < .6, t = good ? r.good[Math.random() * r.good.length | 0] : r.bad[Math.random() * r.bad.length | 0];
      const b = document.createElement('button'); b.className = 'fall'; b.textContent = t; b.dataset.g = good ? 1 : 0; el.appendChild(b);
      const it = { d:b, x: 8 + Math.random() * Math.max(10, W() - b.offsetWidth - 16), y: -40, v: base + Math.random() * 10 + got * step };
      b.style.transform = `translate(${it.x}px,${it.y}px)`; items.push(it);
    };
    const loop = ts => {
      if (!alive) return; const dt = last ? (ts - last) / 1000 : 0; last = ts;
      if (ts > spawnAt && items.length < onScreen) { spawn(); spawnAt = ts + (1150 - d * 450) + Math.random() * 300; }
      items = items.filter(it => { if (it.dead) return false; it.y += it.v * dt; it.d.style.transform = `translate(${it.x}px,${it.y}px)`; if (it.y > H()) { it.d.remove(); return false; } return true; });
      raf = requestAnimationFrame(loop);
    };
    el.addEventListener('pointerdown', e => {
      const b = e.target.closest('.fall'); if (!b || b.classList.contains('hit') || b.classList.contains('miss')) return;
      const it = items.find(i => i.d === b); if (it) it.dead = true;
      if (b.dataset.g === '1') { b.classList.add('hit'); got++; sfx('good'); el.querySelector('#pg').textContent = got + '/' + r.need; if (got >= r.need) { api.ok(); api.win(); } }
      else { b.classList.add('miss'); errs++; el.querySelector('#er').textContent = errs + '/' + max; api.err(); if (errs >= max) api.fail('Pegou coisa errada demais!'); }
      setTimeout(() => b.remove(), 350);
    });
    raf = requestAnimationFrame(loop);
    return () => { alive = false; cancelAnimationFrame(raf); };
  },
  /* montar código com blocos (estilo Duolingo): prévia ao vivo, sem digitar nada */
  blocks(r, el, api){
    const tokens = r.tokens.map(tpl), pool = shuffle([...tokens, ...(r.extra || []).map(tpl)]);
    const pre = tpl(r.pre || ''), post = tpl(r.post || ''), join = r.joiner ?? (r.block ? '\n' : '');
    let pos = 0, errs = 0;
    el.innerHTML = `${pre ? `<pre class="ctx">${esc(pre)}</pre>` : ''}<div class="slots empty ${r.block ? 'block' : ''}" id="sl"></div>${post ? `<pre class="ctx">${esc(post)}</pre>` : ''}
      <div class="pool">${pool.map((t, k) => `<button class="tok" data-k="${k}">${esc(t)}</button>`).join('')}</div>
      ${r.tab ? '<div class="tabbar"><i></i><span id="tabt">Documento sem título</span></div>' : ''}
      <iframe class="preview" title="Prévia ao vivo" ${r.narrow ? 'style="width:360px;max-width:100%"' : ''}></iframe>
      <div class="score"><span>erros <b id="er">0/3</b></span><span id="pg">0/${tokens.length}</span></div>`;
    const sl = el.querySelector('#sl'), fr = el.querySelector('iframe'), tab = el.querySelector('#tabt');
    const render = () => { fr.srcdoc = buildSrc(r, pre + tokens.slice(0, pos).join(join) + post); };
    fr.onload = () => {
      if (tab) tab.textContent = fr.contentDocument.title || 'Documento sem título';
      if (pos === tokens.length) { try { r.capture && r.capture(fr.contentWindow, fr.contentDocument, S); save(); } catch (e) {} api.ok(); setTimeout(api.win, 900); }
    };
    render();
    el.querySelector('.pool').addEventListener('click', e => {
      const b = e.target.closest('.tok'); if (!b || b.classList.contains('used') || pos >= tokens.length) return;
      if (pool[+b.dataset.k] === tokens[pos]) { pos++; b.classList.add('used'); sl.classList.remove('empty'); sfx('good');
        const s = document.createElement('span'); s.className = 'tok'; s.textContent = pool[+b.dataset.k]; sl.appendChild(s);
        el.querySelector('#pg').textContent = pos + '/' + tokens.length; render(); }
      else { errs++; el.querySelector('#er').textContent = errs + '/3'; api.err(b); if (errs >= 3) api.fail('Bloco errado 3 vezes'); }
    });
  },
  /* completar a lacuna: uma peça pequena, com prévia ao vivo */
  fill(r, el, api){
    const opts = shuffle(r.options.map(tpl)), pre = tpl(r.pre), post = tpl(r.post);
    const right = v => (Array.isArray(r.answer) ? r.answer.map(tpl) : [tpl(r.answer)]).includes(v);
    let errs = 0, done = false;
    el.innerHTML = `<pre class="fillcode">${esc(pre)}<span class="gap" id="gap">___</span>${esc(post)}</pre>
      <div class="chips">${opts.map((o, k) => `<button class="tok" data-k="${k}">${esc(o)}</button>`).join('')}</div>
      <iframe class="preview" title="Prévia ao vivo" ${r.narrow ? 'style="width:360px;max-width:100%"' : ''}></iframe>
      <div class="score"><span>erros <b id="er">0/3</b></span><span>toque na peça que falta</span></div>`;
    const fr = el.querySelector('iframe'), gap = el.querySelector('#gap');
    fr.onload = () => { if (!done) return;
      try { r.capture && r.capture(fr.contentWindow, fr.contentDocument, S); save(); } catch (e) {}
      api.ok(); setTimeout(api.win, 1000); };
    fr.srcdoc = buildSrc(r, pre + post);
    el.querySelector('.chips').addEventListener('click', e => {
      const b = e.target.closest('.tok'); if (!b || done || b.disabled) return; const v = opts[+b.dataset.k];
      if (right(v)) { done = true; gap.textContent = v; gap.classList.add('ok'); b.classList.add('good'); fr.srcdoc = buildSrc(r, pre + v + post); }
      else { errs++; b.disabled = true; b.classList.add('bad'); el.querySelector('#er').textContent = errs + '/3'; api.err(b); if (errs >= 3) api.fail('Peça errada 3 vezes'); }
    });
  },
  /* Interrogatório da AVT: o que isso imprime? Errou, perde vida. */
  quiz(r, el, api){
    const opts = shuffle(r.options);
    el.innerHTML = `<div class="avt"><span class="eyebrow">interrogatório da AVT</span><pre class="fillcode">${esc(r.code)}</pre>
      <p class="q">${esc(r.q || 'O que isso imprime?')}</p><div class="chips three">${opts.map((o, k) => `<button class="tok" data-k="${k}">${esc(o)}</button>`).join('')}</div></div>`;
    el.querySelector('.chips').addEventListener('click', e => {
      const b = e.target.closest('.tok'); if (!b) return;
      if (opts[+b.dataset.k] === r.answer) { b.classList.add('good'); api.ok(); setTimeout(api.win, 600); }
      else { b.classList.add('bad'); api.err(b); api.fail('Resposta errada: a AVT tirou uma vida!'); }
    });
  },
  /* Poda: 3 trechos, 1 inválido. Corte ele. */
  prune(r, el, api){
    let k = 0, errs = 0; const max = r.maxErr || 3;
    const show = () => { const s = r.sets[k];
      el.innerHTML = `<div class="score"><span>erros <b>${errs}/${max}</b></span><span>poda ${k + 1}/${r.sets.length}</span></div>
        <div class="snips">${s.snips.map((t, i) => `<button class="snip" data-i="${i}"><span class="cut">✂</span><code>${esc(t)}</code></button>`).join('')}</div>`; };
    show();
    el.addEventListener('click', e => {
      const b = e.target.closest('.snip'); if (!b || b.disabled) return; const s = r.sets[k];
      if (+b.dataset.i === s.bad) { b.classList.add('cutdone'); b.disabled = true; sfx('good'); if (s.why) toast(s.why); k++;
        if (k >= r.sets.length) { api.ok(); setTimeout(api.win, 500); } else setTimeout(show, 550); }
      else { errs++; b.classList.add('wrong'); api.err(b); el.querySelector('.score b').textContent = errs + '/' + max; if (errs >= max) api.fail('Cortou código bom demais!'); }
    });
  },
  /* Desarme a variante: uma linha com bug e o contador do reset correndo. */
  defuse(r, el, api, run){
    let errs = 0; const max = r.maxErr || 2, total = Math.round((r.time || 20) * (run ? run.scale : 1)), t0 = Date.now();
    el.innerHTML = `<div class="bomb"><span class="eyebrow" style="color:var(--bad)">⚠ variante armada</span><b id="cd">${total}</b><small>reset em segundos</small></div>
      <div class="score"><span>erros <b id="er">0/${max}</b></span><span>1 bug</span></div>
      <div class="lines">${r.lines.map((l, i) => `<button class="ln" data-i="${i}"><i>${i + 1}</i>${esc(l)}</button>`).join('')}</div>`;
    const cd = el.querySelector('#cd');
    const tick = setInterval(() => { const left = Math.max(0, Math.ceil(total - (Date.now() - t0) / 1000)); cd.textContent = left; cd.classList.toggle('hot', left <= total * .3); }, 200);
    el.querySelector('.lines').addEventListener('click', e => {
      const b = e.target.closest('.ln'); if (!b) return; const i = +b.dataset.i;
      if (i === r.bad) { b.classList.add('found'); clearInterval(tick); cd.textContent = '✓'; if (r.why) toast(r.why); api.ok(); setTimeout(api.win, 600); }
      else { errs++; el.querySelector('#er').textContent = errs + '/' + max; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); api.err(b); if (errs >= max) api.fail('Linha errada: a variante escapou!'); }
    });
    return () => clearInterval(tick);
  },
  /* Portal instável: as peças na ordem antes do portal fechar (o anel encolhe com o tempo). */
  portal(r, el, api, run){
    ENGINES.order(r, el, api, run);
    el.insertAdjacentHTML('afterbegin', '<div class="portalbox" aria-hidden="true"><div class="pring"></div><span>portal instável</span></div>');
  },
  /* caça aos bugs: toque nas linhas erradas */
  bug(r, el, api){
    const found = new Set(); let errs = 0; const max = r.maxErr || 3;
    el.innerHTML = `<div class="score"><span>erros <b id="er">0/${max}</b></span><span>bugs <b id="pg">0/${r.bad.length}</b></span></div>
      <div class="lines">${r.lines.map((l, i) => `<button class="ln" data-i="${i}"><i>${i + 1}</i>${esc(l)}</button>`).join('')}</div>`;
    el.querySelector('.lines').addEventListener('click', e => {
      const b = e.target.closest('.ln'); if (!b || b.classList.contains('found')) return; const i = +b.dataset.i;
      if (r.bad.includes(i)) { found.add(i); b.classList.add('found'); el.querySelector('#pg').textContent = found.size + '/' + r.bad.length; if (r.why && r.why[i]) toast(r.why[i]);
        if (found.size === r.bad.length) { api.ok(); setTimeout(api.win, 500); } }
      else { errs++; el.querySelector('#er').textContent = errs + '/' + max; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); api.err(); if (errs >= max) api.fail('Essa linha estava certa!'); }
    });
  },
  /* editor real + prévia ao vivo; verifica sozinho enquanto você digita */
  code(r, el, api){
    const KEYS = { html:['<', '>', '/', '"', '=', '<h1>', '</h1>', '<p>', '</p>'], css:['{', '}', ':', ';', '.', '#', 'px', 'color:', 'var(--'], js:['(', ')', '{', '}', ';', '"', '.', '=>', '=', 'document.querySelector(']}[r.lang];
    el.innerHTML = `<div class="codewrap"><div style="min-width:0;display:grid"><textarea class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código ${r.lang}" id="ed-${r.lang}"></textarea>
      <div class="keys">${KEYS.map(k => `<button type="button" data-k="${esc(k)}">${esc(k)}</button>`).join('')}<button type="button" data-hint style="border-color:var(--pink);color:var(--pink)">dica</button></div></div>
      <div style="min-width:0;background:#fff;display:flex;justify-content:center"><iframe class="preview" title="Prévia ao vivo" ${r.narrow ? 'style="width:360px;max-width:100%"' : ''}></iframe></div></div>
      <div class="status" id="stt">${r.lang.toUpperCase()} · a prévia atualiza enquanto você digita</div>`;
    const ed = el.querySelector('textarea'), fr = el.querySelector('iframe'), stt = el.querySelector('#stt');
    ed.value = r.start || ''; let ver = 0, tmo, done = false;
    const build = src => buildSrc(r, src);
    const test = () => {
      const v = ++ver, src = ed.value;
      fr.onload = () => { if (v !== ver || done) return;
        let res; try { res = r.check(fr.contentWindow, fr.contentDocument, src); } catch (e) { res = 'Ainda não: ' + e.message; }
        if (res === true) { done = true; stt.className = 'status ok'; stt.textContent = '✓ funcionou!';
          try { r.capture && r.capture(fr.contentWindow, fr.contentDocument, S); save(); } catch (e) {}
          api.ok(); setTimeout(api.win, 700); }
        else { stt.className = 'status'; stt.textContent = '→ ' + (typeof res === 'string' ? res : 'ainda não'); }
      };
      fr.srcdoc = build(src);
    };
    ed.addEventListener('input', () => { clearTimeout(tmo); tmo = setTimeout(test, 450); });
    ed.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); ins('  '); } });
    const ins = s => { const a = ed.selectionStart, b = ed.selectionEnd; ed.value = ed.value.slice(0, a) + s + ed.value.slice(b); ed.selectionStart = ed.selectionEnd = a + s.length; ed.focus(); ed.dispatchEvent(new Event('input')); };
    el.querySelector('.keys').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-hint')) { api.hint(); return; } ins(b.dataset.k); });
    test();
    return () => { ver++; clearTimeout(tmo); };
  },
  /* ajuste as propriedades até a cena bater com o alvo tracejado */
  tune(r, el, api){
    const val = {}; r.ctrls.forEach(c => val[c.p] = c.o[0]);
    const scene = (v, ghost) => {
      const cls = ghost ? 'gh' : 'me';
      const styl = Object.entries(v).map(([k, x]) => `${k}:${x}`).join(';');
      if (r.mode === 'box') return `<div class="lay"><div class="bx ${cls}" style="${styl};border-style:${ghost ? 'dashed' : 'solid'}">Card</div></div>`;
      if (r.mode === 'flex') return `<div class="lay fx" style="display:flex;${styl}">${[1, 2, 3].map(n => `<div class="it ${cls}">${n}</div>`).join('')}</div>`;
      if (r.mode === 'grid') return `<div class="lay" style="display:grid;${styl}">${[1, 2, 3, 4].map(n => `<div class="it ${cls}" style="width:auto">${n}</div>`).join('')}</div>`;
      if (r.mode === 'pos') return `<div class="lay" style="position:relative"><div class="cardp">Projeto</div><div class="selo ${cls}" style="${styl}">NOVO</div></div>`;
    };
    el.innerHTML = `<style>
      .tscene{position:relative;height:220px;margin:12px;border-radius:12px;background:#0b1120;border:1px solid var(--line);overflow:hidden}
      .tscene .layer{position:absolute;inset:10px}
      .lay{width:100%;height:100%;gap:10px}
      .lay.fx{gap:10px}
      .it{width:52px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;transition:all .35s}
      .it.gh,.bx.gh,.selo.gh{background:transparent!important;border:2px dashed #3a4a6e;color:transparent}
      .it.me{background:linear-gradient(135deg,var(--css),#1a7fe0);color:#02101c;box-shadow:0 0 16px -2px var(--css)}
      .bx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-color:var(--css);font-family:var(--f-mono);transition:all .35s;color:#fff}
      .bx.me{background:color-mix(in srgb,var(--css) 25%,transparent);border-color:var(--css)}
      .cardp{position:absolute;inset:30px 40px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono)}
      .selo{padding:6px 10px;border-radius:8px;font-family:var(--f-mono);font-weight:700;font-size:.8rem;transition:all .35s;width:max-content}
      .selo.me{background:var(--js);color:#1c1500;box-shadow:0 0 14px var(--js)}
      .ok-glow .it.me,.ok-glow .selo.me,.ok-glow .bx.me{box-shadow:0 0 24px var(--good);outline:2px solid var(--good)}
    </style>
    <div class="tscene" id="ts"><div class="layer">${scene(r.target, true)}</div><div class="layer" id="me">${scene(val, false)}</div></div>
    <div class="ctrls">${r.ctrls.map((c, ci) => `<div class="ctrl"><label>${c.p}:</label><div class="opts">${c.o.map(o => `<button data-c="${ci}" data-v="${o}" class="${o === val[c.p] ? 'on' : ''}">${o}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="status mono" id="css-out"></div>`;
    const out = () => el.querySelector('#css-out').textContent = (r.mode === 'box' ? '.card' : r.mode === 'pos' ? '.selo' : '.container') + ' { ' + Object.entries(val).map(([k, v]) => `${k}: ${v};`).join(' ') + ' }';
    out();
    el.querySelector('.ctrls').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return; const c = r.ctrls[+b.dataset.c]; val[c.p] = b.dataset.v;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      el.querySelector('#me').innerHTML = scene(val, false); out();
      if (Object.keys(r.target).every(k => r.target[k] === val[k])) { el.querySelector('#ts').classList.add('ok-glow'); api.ok(); setTimeout(api.win, 700); }
    });
  }
};

/* boot */
render();
</script>
