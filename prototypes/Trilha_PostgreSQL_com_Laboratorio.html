<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trilha PostgreSQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0a0912;
  --bg2:#100e1b;
  --panel:#151225;
  --panel2:#1b1731;
  --line:#2c2647;
  --text:#ece9f8;
  --muted:#9b94b8;
  --purple:#9b4dff;
  --purple-soft:#c9a2ff;
  --orange:#ff6b1f;
  --orange-soft:#ffa36b;
  --good:#3ee0a1;
  --bad:#ff5d7a;
  --code-str:#8be9b0;
  --code-num:#ffd479;
  --f-display:"Syne","Trebuchet MS",sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-inline:16px;padding-block:0 48px;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(155,77,255,.16),transparent 60%),radial-gradient(700px 420px at -5% 30%,rgba(255,107,31,.07),transparent 60%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--f-mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--orange-soft)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.app{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .dot{width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,var(--purple),var(--orange));box-shadow:0 0 14px rgba(155,77,255,.8)}
.stat{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat b{color:var(--orange);font-weight:700;font-size:.95rem}
.bar{width:120px;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--orange));transition:width .5s}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}

/* trail map */
.map{position:sticky;top:12px;display:flex;flex-direction:column;padding:6px 0;max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:thin}
.node{display:flex;align-items:center;gap:12px;padding:7px 8px;border:0;background:none;text-align:left;border-radius:10px;position:relative;color:var(--muted);font-size:.9rem;width:100%}
.node .c{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;background:var(--bg);position:relative;z-index:1}
.node:not(:last-child)::after{content:"";position:absolute;left:21px;top:34px;bottom:-7px;width:2px;background:var(--line)}
.node.done{color:var(--text)}
.node.done .c{background:var(--purple);border-color:var(--purple);color:#fff}
.node.done:not(:last-child)::after{background:var(--purple)}
.node.cur{color:#fff;background:var(--panel)}
.node.cur .c{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,31,.18),0 0 16px rgba(255,107,31,.6)}
.node.lock{opacity:.45;cursor:not-allowed}
.node.sel:not(.cur){background:var(--panel)}
.node.trophy .c{border-color:var(--orange-soft);color:var(--orange)}
.node.trophy.done .c{background:var(--orange);border-color:var(--orange);color:#1a0d05}

/* generic */
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700;margin:40px 0 12px;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:1.12rem;color:var(--muted);max-width:60ch}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:linear-gradient(135deg,var(--purple),#7b2ff0);color:#fff;box-shadow:0 8px 28px -8px rgba(155,77,255,.8);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.alt{background:linear-gradient(135deg,var(--orange),#e8500a);box-shadow:0 8px 28px -8px rgba(255,107,31,.8)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:8px 8px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--purple-soft),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 6px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.facts b{display:block;font-family:var(--f-display);font-size:1.9rem;color:var(--text)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:8px}
.how div{border-top:2px solid var(--purple);padding-top:12px}
.how div:nth-child(2){border-color:var(--orange)}
.how b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.how span{color:var(--muted);font-size:.93rem}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{color:var(--purple-soft);margin-bottom:6px;font-size:1rem}
.card p{font-size:.93rem;color:var(--muted);margin:0}
.card code{font-size:.8em}

.note{border-left:3px solid var(--purple);background:var(--panel);border-radius:0 12px 12px 0;padding:14px 18px;margin:20px 0;max-width:72ch}
.note b.k{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-soft);margin-bottom:4px}
.note p{margin:0;color:var(--text)}
.note.warn{border-color:var(--orange)}
.note.warn b.k{color:var(--orange)}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:12px 0 20px;display:grid;gap:8px;max-width:68ch}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:baseline}
ol.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--orange);font-family:var(--f-mono);font-size:.75rem;display:grid;place-items:center;transform:translateY(-1px)}
ul.tick{list-style:none;padding:0;margin:10px 0 20px;display:grid;gap:8px;max-width:68ch}
ul.tick li{padding-left:22px;position:relative}
ul.tick li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--orange);box-shadow:0 0 8px var(--orange)}

.flow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px;align-items:center}
.flow span{font-family:var(--f-mono);font-size:.82rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.flow span.a{border-color:var(--purple);color:var(--purple-soft)}
.flow i{color:var(--orange);font-style:normal}

.tbl{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl table{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-family:var(--f-mono);color:var(--orange-soft);white-space:nowrap}

/* macbook */
.mac{width:100%;max-width:860px;margin:18px auto 34px}
.mac-lid{position:relative;border:1.5px solid transparent;border-radius:20px 20px 6px 6px;padding:14px 14px 16px;
  background:linear-gradient(#050409,#050409) padding-box,linear-gradient(135deg,var(--purple),#5b2bb0 45%,var(--orange)) border-box;
  box-shadow:0 0 70px -14px rgba(155,77,255,.6),0 24px 80px -30px rgba(255,107,31,.4)}
.mac-lid::before{content:"";position:absolute;top:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#1d1a2e;box-shadow:inset 0 0 0 1px #2c2647}
.mac-screen{background:#0d0b17;border-radius:8px;overflow:hidden;border:1px solid #221c38;margin-top:4px}
.win-bar{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#12101f;border-bottom:1px solid #221c38}
.win-bar i{width:11px;height:11px;border-radius:50%}
.win-bar i:nth-child(1){background:#ff5f57}.win-bar i:nth-child(2){background:#febc2e}.win-bar i:nth-child(3){background:#28c840}
.win-title{margin-left:10px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-body{padding:0;overflow-x:auto}
.mac-base{height:13px;margin:0 -3.5%;border-radius:0 0 22px 22px;background:linear-gradient(#332c4f,#171227);position:relative;box-shadow:0 18px 40px -14px rgba(155,77,255,.5)}
.mac-base::after{content:"";position:absolute;left:50%;top:0;width:16%;height:6px;transform:translateX(-50%);background:#0a0812;border-radius:0 0 8px 8px}

pre.sql{margin:0;padding:16px 4px 16px 0;font-family:var(--f-mono);font-size:.84rem;line-height:1.7;counter-reset:ln;min-width:max-content}
pre.sql .l{display:block;padding-right:18px;white-space:pre}
pre.sql .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:38px;padding-right:14px;text-align:right;color:#4a4368;user-select:none}
.kw{color:var(--orange);font-weight:500}
.t{color:var(--purple-soft)}
.s{color:var(--code-str)}
.n{color:var(--code-num)}
.cm{color:#6a6288;font-style:italic}
.f{color:#7fd4ff}
.res{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.82rem}
.res th{background:#17132b;color:var(--purple-soft);text-align:left;padding:9px 16px;font-weight:500;border-bottom:1px solid #2c2647;white-space:nowrap}
.res td{padding:8px 16px;border-bottom:1px solid #1b1731;white-space:nowrap}
.res tr:last-child td{border-bottom:0}
.res .null{color:#6a6288;font-style:italic}
.res-foot{padding:8px 16px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border-top:1px solid #221c38;background:#12101f}
.caret{display:inline-block;width:8px;height:1em;background:var(--orange);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* gui mock */
.gui{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:330px;font-size:.82rem}
.tree{background:#0f0c1a;border-right:1px solid #221c38;padding:12px 8px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);line-height:2;overflow:hidden}
.tree div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .l1{padding-left:10px}.tree .l2{padding-left:20px}.tree .l3{padding-left:30px}.tree .l4{padding-left:40px}.tree .l5{padding-left:50px}
.tree .hi{color:var(--orange);font-weight:700}
.pane{padding:14px 16px;min-width:0}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #221c38}
.tabs button{background:none;border:0;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;font-size:.82rem;font-weight:600}
.tabs button.on{color:#fff;border-color:var(--orange)}
.gui label.fl{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.gui input[type=text],.gui select{background:#0a0812;border:1px solid #2c2647;border-radius:7px;color:var(--text);padding:7px 9px;font-family:var(--f-mono);font-size:.8rem;width:100%;min-width:0}
.gui input[type=text]:focus,.gui select:focus{border-color:var(--purple);outline:0}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 42px 42px 26px;gap:6px;align-items:center;margin-bottom:6px}
.crow.h{color:var(--muted);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.crow .ck{text-align:center}
.crow input[type=checkbox]{accent-color:var(--orange);width:16px;height:16px}
.crow .x{background:none;border:0;color:var(--muted);font-size:1rem;line-height:1}
.crow .x:hover{color:var(--bad)}
.addc{margin-top:6px;background:transparent;border:1px dashed var(--purple);color:var(--purple-soft);border-radius:8px;padding:6px 12px;font-size:.78rem}
.gnote{margin:14px 0 0;font-size:.78rem;color:var(--muted);max-width:none}
.gui pre.sql{padding-block:6px}

.sx-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:-6px}
.sx-tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.85rem;color:var(--muted)}
.sx-tabs button.on{border-color:var(--orange);color:#fff;box-shadow:0 0 16px -4px rgba(255,107,31,.7)}

/* quiz */
.quiz{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:760px}
.qtop{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
.qtop span:last-child{color:var(--muted)}
.qq{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.3;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:baseline;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--purple)}
.opt b{font-family:var(--f-mono);color:var(--purple-soft);font-size:.8rem}
.opt.ok{border-color:var(--good);background:rgba(62,224,161,.1)}
.opt.no{border-color:var(--bad);background:rgba(255,93,122,.1);opacity:.7}
.opt[disabled]{cursor:default}
.fillrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0a0812;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--f-mono);font-size:.95rem;margin-bottom:12px}
.fillrow input{background:var(--panel2);border:1px dashed var(--orange);border-radius:6px;color:var(--orange-soft);font-family:var(--f-mono);font-size:.95rem;padding:4px 8px;width:11ch;min-width:0}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.94rem}
.fb.good{background:rgba(62,224,161,.1);border:1px solid rgba(62,224,161,.4)}
.fb.bad{background:rgba(255,93,122,.1);border:1px solid rgba(255,93,122,.4)}
.qact{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.qdone{border:1px solid var(--purple);background:var(--panel);border-radius:16px;padding:22px;max-width:760px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.qdone p{margin:0}

/* trophy */
.trophy-wrap{text-align:center;padding-block:10px 20px;position:relative}
.trophy-wrap svg{width:min(260px,70%);height:auto;filter:drop-shadow(0 0 40px rgba(255,107,31,.55))}
.trophy-wrap h1{margin:10px 0 10px}
.trophy-wrap p{margin-inline:auto}
.rank{display:inline-block;font-family:var(--f-mono);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--orange);color:var(--orange);border-radius:999px;padding:6px 16px;margin:6px 0 18px;box-shadow:0 0 20px -4px rgba(255,107,31,.6)}
.tstats{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:14px 0 24px}
.tstats b{display:block;font-family:var(--f-display);font-size:2rem}
.tstats span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.locked-note{color:var(--muted)}

footer.ft{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.ft button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}

@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .map{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:4px 0 10px;gap:2px;border-bottom:1px solid var(--line)}
  .node{width:auto;flex:none;padding:4px}
  .node .t2{display:none}
  .node:not(:last-child)::after{display:none}
  .gui{grid-template-columns:minmax(0,1fr)}
  .tree{display:none}
  .bar{width:80px}
}
@media(max-width:520px){
  .crow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 34px 34px 22px}
  .mac-base{margin:0 -2%}
  .qbox{padding:16px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .caret{animation:none}
  .btn,.bar i{transition:none}
}
.gui [data-sql]{overflow-x:auto}
.win-title{flex:0 1 auto}
.runbtn{margin-left:auto;background:transparent;border:1px solid var(--purple);color:var(--purple-soft);border-radius:6px;padding:3px 10px;font-size:.72rem;font-family:var(--f-mono);white-space:nowrap}
.runbtn:hover{background:rgba(155,77,255,.18);color:#fff}
.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:8px}
.btn small{font-family:var(--f-mono);font-weight:400;opacity:.75;margin-left:4px}
.labbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin:20px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 14px;font-size:.86rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--purple);color:#fff}
.labstat{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.labstat.bad{color:var(--bad);max-width:70ch;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:32px;margin-bottom:4px}
.chips-l{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-family:var(--f-mono);font-size:.78rem;color:var(--orange-soft)}
.chip:hover{border-color:var(--orange)}
#labsql{display:block;width:100%;min-height:190px;background:#0a0812;color:var(--text);border:0;padding:14px 16px;font-family:var(--f-mono);font-size:.86rem;line-height:1.7;resize:vertical;tab-size:4;caret-color:var(--orange)}
#labsql:focus{outline:0;box-shadow:inset 0 0 0 1px var(--purple)}
.labact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #221c38;background:#12101f}
.labtip{margin-left:auto;font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
#labout{min-height:110px}
.out-scroll{overflow-x:auto}
.out-ok,.out-info{padding:12px 16px;font-family:var(--f-mono);font-size:.82rem}
.out-ok{color:var(--good)}
.out-info{color:var(--purple-soft);line-height:1.6}
.out-info code{font-size:.9em}
.out-err{padding:14px 16px;border-left:3px solid var(--bad);background:rgba(255,93,122,.08)}
.out-err .raw{display:block;background:none;border:0;padding:0;color:var(--bad);font-size:.82rem;white-space:pre-wrap;word-break:break-word}
.out-err p{margin:8px 0 0;font-size:.92rem;color:var(--text);max-width:none}
h2 .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--orange);margin-left:8px;border:1px solid var(--orange);border-radius:999px;padding:2px 10px;vertical-align:middle}

{

    {t:'note', k:'Analogia', x:`Pense numa biblioteca. Os <b>livros</b> são os dados, a <b>biblioteca</b> inteira é o banco de dados e o <b>bibliotecário</b> é o SGBD: ele sabe onde tudo está, controla quem pega o quê e não deixa dois leitores levarem o mesmo exemplar.`}

    {q:'O nome de um cliente escrito de três formas diferentes em planilhas separadas é qual problema?', o:['Escala','Segurança','Inconsistência','Concorrência'], a:2, e:'Dados que deveriam ser iguais aparecem diferentes: isso é inconsistência.'},
    {q:'Quem propôs o modelo relacional em 1970?', o:['Edgar F. Codd','Bill Gates','Linus Torvalds','Larry Ellison'], a:0, e:'Codd, da IBM. O modelo relacional organiza dados em tabelas.'}

{

{
  id:'interface', short:'Conhecendo a interface', tag:'Ferramentas',

    {t:'gui'},
    {t:'note', k:'Dica', x:`No pgAdmin real, toda janela de criação tem uma aba <b>SQL</b> que mostra o comando gerado. É uma das melhores formas de aprender SQL: faça por cliques e leia o código que apareceu.`},
    {t:'h', x:'Por que quem trabalha na área prefere código?'},
    {t:'ul', items:[
      '<b>Repetível</b>: o mesmo script cria o banco igual em qualquer computador.',

  quiz:[

    {q:'Qual é uma vantagem de criar o banco por scripts de código?', o:['É impossível errar','Não precisa de senha','Pode ser repetido e versionado no Git','Só funciona no Mac'], a:2, e:'Scripts são repetíveis e podem ser guardados e revisados como qualquer código.'},

{
  id:'sintaxe', short:'Sintaxe e indentação', tag:'Ferramentas',
  title:'Sintaxe e indentação: escrever SQL que gente lê',
  lead:'O PostgreSQL entende SQL de qualquer jeito. Pessoas, não. Aprenda as regras e as boas maneiras.',

      'Todo comando termina com <code>;</code> (ponto e vírgula).',

      'Comentários: <code>-- uma linha</code> ou <code>/* vários trechos */</code>. O banco ignora tudo isso.',
      'Sem aspas, o PostgreSQL trata nomes como minúsculos: <code>Produtos</code> e <code>produtos</code> são a mesma tabela.'

    {t:'h', x:'As boas maneiras (convenções)'},
    {t:'ul', items:[
      'Palavras da linguagem em <b>MAIÚSCULAS</b> (<code>SELECT</code>, <code>FROM</code>) e nomes que você inventa em <b>minúsculas</b> com underline: <code>data_pedido</code>. Isso se chama snake_case.',
      'Uma <b>cláusula por linha</b>: <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code> cada uma começando uma linha nova.',

    {t:'p', x:`Veja a mesma consulta escrita de dois jeitos. As duas funcionam exatamente igual. Clique nas abas e responda: em qual você acharia um erro mais rápido?`},
    {t:'syntax'},

  quiz:[

{
  id:'tiposdados', short:'Tipos de dados', tag:'Estrutura',

    {q:'Qual tipo numera sozinho 1, 2, 3... a cada nova linha?', o:['SERIAL','VARCHAR','TIMESTAMP','JSONB'], a:0, e:'SERIAL cria uma sequência automática, ótima para chaves primárias.'}

{
  id:'create', short:'CREATE DATABASE e TABLE', tag:'Estrutura',

    {t:'code', file:'02_criar_tabelas.sql', x:`CREATE TABLE categorias (

);

    id            SERIAL PRIMARY KEY,
    nome          VARCHAR(120) NOT NULL,
    descricao     TEXT,
    preco         NUMERIC(10, 2) NOT NULL CHECK (preco >= 0),
    estoque       INTEGER NOT NULL DEFAULT 0,
    ativo         BOOLEAN DEFAULT TRUE,

);`},

);`},

      {t:'code', file:'25_trigger.sql', x:`CREATE TABLE log_precos (
    id            SERIAL PRIMARY KEY,
    produto_id    INTEGER,
    preco_antigo  NUMERIC(10, 2),
    preco_novo    NUMERIC(10, 2),
    alterado_em   TIMESTAMP DEFAULT NOW()
);

CREATE OR REPLACE FUNCTION registrar_preco() RETURNS TRIGGER AS $$
BEGIN
    IF NEW.preco <> OLD.preco THEN
        INSERT INTO log_precos (produto_id, preco_antigo, preco_novo)
        VALUES (OLD.id, OLD.preco, NEW.preco);
    END IF;
    RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER trg_preco
AFTER UPDATE ON produtos
FOR EACH ROW EXECUTE FUNCTION registrar_preco();

UPDATE produtos SET preco = 139.90 WHERE id = 2;

SELECT produto_id, preco_antigo, preco_novo FROM log_precos;`},

/* ---- realce de sintaxe SQL ---- */
const KW = new Set('CREATE DATABASE TABLE SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE DROP ALTER ADD COLUMN PRIMARY KEY NOT NULL UNIQUE DEFAULT CHECK REFERENCES AND OR IN BETWEEN LIKE ILIKE IS AS ORDER BY GROUP HAVING LIMIT OFFSET JOIN INNER LEFT RIGHT ON DESC ASC BEGIN COMMIT ROLLBACK INDEX VIEW EXPLAIN ANALYZE TRUE FALSE WITH EXISTS CASE WHEN THEN ELSE END OVER PARTITION UNION EXCEPT INTERSECT CROSS FULL OUTER DISTINCT GRANT REVOKE TRIGGER FUNCTION RETURNS RETURN LANGUAGE ROLE LOGIN PASSWORD CASCADE FOR EACH ROW EXECUTE PROCEDURE AFTER BEFORE TO USING ALL ANY SAVEPOINT START TRANSACTION ISOLATION LEVEL'.split(' '));
const TY = new Set('INTEGER INT SERIAL BIGINT NUMERIC VARCHAR TEXT BOOLEAN DATE TIMESTAMP UUID JSONB CHAR'.split(' '));
const FN = new Set('COUNT SUM AVG MIN MAX ROUND COALESCE NOW ROW_NUMBER RANK LAG LEAD'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(src) {
  const re = /(--[^\n]*)|('(?:[^']|'')*')|(\\[a-zA-Z]+)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_][A-Za-z0-9_]*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="cm">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="kw">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="n">${m[4]}</span>`;
    else {
      const u = m[5].toUpperCase();
      out += KW.has(u) ? `<span class="kw">${m[5]}</span>` : TY.has(u) ? `<span class="t">${m[5]}</span>` : FN.has(u) ? `<span class="f">${m[5]}</span>` : esc(m[5]);
    }
  }
  return out + esc(src.slice(last));
}
const sqlHtml = src => `<pre class="sql">${hl(src).split('\n').map(l => `<span class="l">${l || ' '}</span>`).join('')}</pre>`;

/* ---- blocos de conteúdo ---- */
function block(b) {
  switch (b.t) {
    case 'h': return `<h2>${b.x}</h2>`;
    case 'p': return `<p>${b.x}</p>`;
    case 'note': return `<div class="note${b.warn ? ' warn' : ''}"><b class="k">${b.k}</b><p>${b.x}</p></div>`;
    case 'cards': return `<div class="cards">${b.items.map(c => `<div class="card"><h3>${c.h}</h3><p>${c.x}</p></div>`).join('')}</div>`;
    case 'ul': return `<ul class="tick">${b.items.map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'ol': return `<ol class="steps">${b.items.map(x => `<li><span>${x}</span></li>`).join('')}</ol>`;
    case 'flow': return `<div class="flow">${b.items.map((x, i) => (i ? '<i>→</i>' : '') + `<span${x === 'SELECT' ? ' class="a"' : ''}>${x}</span>`).join('')}</div>`;
    case 'code': { let ex = ''; if (!b.nolab) { LABCODE.push(b.x); ex = `<button type="button" class="runbtn" data-lab="${LABCODE.length - 1}">Abrir no laboratório ▸</button>`; } return mac(b.file, sqlHtml(b.x), ex); }
    case 'table': {
      if (b.mac === false) return `<div class="tbl"><table><thead><tr>${b.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      const t = `<table class="res"><thead><tr>${b.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => c === 'NULL' ? '<td class="null">NULL</td>' : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      return mac(b.file, t);
    }
    case 'raw': return mac(b.file, `<div class="der">${b.x}</div>`);
    case 'gui': return guiHtml();
    case 'syntax': return syntaxHtml();
  }
  return '';
}

function initGui(root) {
  const g = root.querySelector('[data-gui]'); if (!g) return;
  const cols = [
    { n: 'id', t: 'SERIAL', pk: true, nn: true },
    { n: 'nome', t: 'VARCHAR(100)', pk: false, nn: true },
    { n: 'email', t: 'VARCHAR(100)', pk: false, nn: false }
  ];
  const nameIn = g.querySelector('[data-name]'), list = g.querySelector('[data-cols]'), sqlBox = g.querySelector('[data-sql]'), tree = g.querySelector('[data-tree]');
  const slug = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
  function gen() {
    const tn = slug(nameIn.value) || 'minha_tabela';
    tree.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;' + tn;
    const rows = cols.map(c => {
      const n = slug(c.n) || 'coluna';
      return `    ${n} ${c.t}${c.pk ? ' PRIMARY KEY' : c.nn ? ' NOT NULL' : ''}`;
    });
    sqlBox.innerHTML = sqlHtml(`CREATE TABLE ${tn} (\n${rows.join(',\n')}\n);`);
  }
  function draw() {
    list.innerHTML = cols.map((c, i) => `<div class="crow" data-i="${i}">
      <input type="text" data-f="n" value="${esc(c.n)}" aria-label="Nome da coluna ${i + 1}" maxlength="30">
      <select data-f="t" aria-label="Tipo da coluna ${i + 1}">${GTYPES.map(t => `<option${t === c.t ? ' selected' : ''}>${t}</option>`).join('')}</select>
      <span class="ck"><input type="checkbox" data-f="pk" aria-label="Chave primária"${c.pk ? ' checked' : ''}></span>
      <span class="ck"><input type="checkbox" data-f="nn" aria-label="Obrigatória"${c.nn ? ' checked' : ''}></span>
      <button type="button" class="x" data-del aria-label="Remover coluna">×</button></div>`).join('');
  }
  g.addEventListener('input', e => {
    if (e.target === nameIn) return gen();
    const row = e.target.closest('.crow'); if (!row) return;
    const c = cols[+row.dataset.i], f = e.target.dataset.f;
    c[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    gen();
  });
  g.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      g.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab));
      g.querySelector('[data-pane="v"]').hidden = tab.dataset.tab !== 'v';
      g.querySelector('[data-pane="s"]').hidden = tab.dataset.tab !== 's';
    }
    if (e.target.closest('[data-add]') && cols.length < 8) { cols.push({ n: 'nova_coluna', t: 'VARCHAR(100)', pk: false, nn: false }); draw(); gen(); }
    if (e.target.closest('[data-del]') && cols.length > 1) { cols.splice(+e.target.closest('.crow').dataset.i, 1); draw(); gen(); }
  });
  draw(); gen();
}

/* ---- desafio ---- */
function runQuiz(mi, host) {
  const m = MODS[mi], Q = m.quiz;
  let qi = 0, tries = 0, gained = 0;
  const box = document.createElement('div'); box.className = 'qbox'; host.appendChild(box);
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');

  function draw() {
    const q = Q[qi]; tries = 0;
    let body;
    if (q.fill) {
      body = `<div class="fillrow"><span>${esc(q.pre)}</span><input type="text" id="fillin" placeholder="${q.ph || '?'}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Sua resposta"><span>${esc(q.post)}</span></div><div class="qact"><button class="btn" id="fillgo">Verificar</button></div>`;
    } else {
      body = `<div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
    }
    box.innerHTML = `<div class="qtop"><span>Pergunta ${qi + 1} de ${Q.length}</span><span>+${gained} XP</span></div><div class="qq">${esc(q.q)}</div>${body}<div id="fb"></div>`;
    if (q.fill) { const inp = $('#fillin'); inp.focus({ preventScroll: true }); inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }); $('#fillgo').onclick = check; }
    else box.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k, b));
  }
  function right() {
    const q = Q[qi], pts = tries === 0 ? 100 : 40;
    S.xp += pts; gained += pts; S.total++; if (tries === 0) S.first++; save(); renderMap();
    $('.qtop span:last-child', box).textContent = `+${gained} XP`;
    box.querySelectorAll('.opt').forEach(b => b.disabled = true);
    const inp = $('#fillin'); if (inp) { inp.disabled = true; $('#fillgo').hidden = true; }
    const lastQ = qi === Q.length - 1;
    $('#fb').innerHTML = `<div class="fb good"><b>Certo! +${pts} XP.</b> ${q.e}</div><div class="qact"><button class="btn${lastQ ? ' alt' : ''}" id="nx">${lastQ ? 'Concluir módulo (+150 XP)' : 'Próxima pergunta'}</button></div>`;
    $('#nx').focus({ preventScroll: true });
    $('#nx').onclick = () => { if (!lastQ) { qi++; draw(); } else finish(); };
  }
  function wrong() {
    tries++;
    $('#fb').innerHTML = `<div class="fb bad"><b>Ainda não.</b> Releia o módulo e tente de novo. Acertar agora vale menos XP, mas vale muito de aprendizado.</div>`;
  }
  function pick(k, btn) {
    if (k === Q[qi].a) { btn.classList.add('ok'); right(); }
    else { btn.classList.add('no'); btn.disabled = true; wrong(); }
  }
  function check() {
    const q = Q[qi], v = norm($('#fillin').value);
    if (q.ok.some(x => norm(x) === v)) right(); else wrong();
  }
  function finish() {
    S.done[m.id] = true; S.xp += 150; save();
    if (mi === N - 1 && allDone()) go('trophy'); else go(mi === N - 1 ? 'home' : mi + 1);
  }
  draw();
}

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = $('canvas.conf'); if (old) old.remove();
  const c = document.createElement('canvas'); c.className = 'conf'; document.body.appendChild(c);
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#9b4dff', '#ff6b1f', '#ffd479', '#c9a2ff', '#ffa36b'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[(Math.random() * cols.length) | 0] }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (++f < 260 && c.isConnected) requestAnimationFrame(tick); else c.remove();
  })();
}

async function resetDataset(db, ds) {

/* ---- formatação de valores ---- */
function fmt(v) {
  if (v === null || v === undefined) return 'NULL';
  if (v instanceof Date) return v.toISOString().replace('T', ' ').slice(0, 19);
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

/* ---- dicas em português para erros comuns ---- */
function hintFor(msg) {
  let m;
  if ((m = msg.match(/relation "(.+?)" does not exist/))) return `A tabela "${m[1]}" não existe. Digite \\dt para listar as tabelas disponíveis, ou confira se você já rodou o CREATE TABLE.`;
  if ((m = msg.match(/column "(.+?)" (?:of relation "(.+?)" )?does not exist/))) return `A coluna "${m[1]}" não existe${m[2] ? ' em ' + m[2] : ''}. Use \\d nome_da_tabela para ver as colunas.`;
  if ((m = msg.match(/syntax error at or near "(.*?)"/))) return `Erro de sintaxe perto de "${m[1]}". Procure uma vírgula faltando ou sobrando, parêntese aberto, aspas sem fechar ou palavra digitada errada.`;
  if (/syntax error at end of input/.test(msg)) return 'O comando terminou antes da hora: falta fechar um parêntese ou completar uma cláusula.';
  if ((m = msg.match(/null value in column "(.+?)".*not-null/))) return `A coluna "${m[1]}" é obrigatória (NOT NULL). Informe um valor para ela.`;
  if (/duplicate key value/.test(msg)) return 'Esse valor já existe em uma coluna PRIMARY KEY ou UNIQUE. Use outro valor.';
  if (/violates foreign key constraint/.test(msg)) return 'Chave estrangeira: o registro apontado não existe, ou ainda está sendo usado por outra tabela.';
  if (/violates check constraint/.test(msg)) return 'Um valor quebrou a regra CHECK da tabela (por exemplo, preço negativo).';
  if (/already exists/.test(msg)) return 'Esse nome já existe. Escolha outro nome ou apague o antigo com DROP. Dica: o botão "Banco vazio" recomeça do zero.';
  if (/invalid input syntax/.test(msg)) return 'O valor não combina com o tipo da coluna (por exemplo, texto onde se esperava número).';
  if (/current transaction is aborted/.test(msg)) return 'Você tem uma transação com erro aberta. Rode ROLLBACK; para desfazê-la e continuar.';
  if (/must appear in the GROUP BY/.test(msg)) return 'Toda coluna do SELECT que não está dentro de COUNT/SUM/AVG precisa estar no GROUP BY.';
  if (/ambiguous/.test(msg)) return 'O nome da coluna existe em mais de uma tabela. Diga de qual: tabela.coluna.';
  return '';
}

/* ---- executa texto do aluno: comandos psql + SQL ---- */
async function runSql(db, text) {
  const out = [];
  const isEmpty = s => s.replace(/--.*$/gm, '').trim() === '';
  let sqlText = text;
  if (/\b(create|drop)\s+database\b/i.test(sqlText.replace(/--.*$/gm, ''))) {
    out.push({ kind: 'info', msg: 'CREATE DATABASE e DROP DATABASE não rodam aqui: o laboratório já é um banco pronto para uso. Em um servidor real, esse comando cria (ou apaga) um banco inteiro.' });
    sqlText = sqlText.replace(/^(?!\s*--).*\b(create|drop)\s+database\b[^;]*;?/gim, '');
  }
  const lines = sqlText.split('\n');
  let buf = [];
  const flush = async () => {
    const chunk = buf.join('\n'); buf = [];
    if (isEmpty(chunk)) return true;
    try {
      const res = await db.exec(chunk, { rowMode: 'array' });
      res.forEach(r => {
        if (r.fields && r.fields.length) out.push({ kind: 'table', cols: r.fields.map(f => f.name), rows: r.rows });
        else out.push({ kind: 'ok', n: r.affectedRows || 0 });
      });
      return true;
    } catch (e) { out.push({ kind: 'err', msg: String(e.message || e) }); return false; }
  };
  for (const line of lines) {
    if (/^\s*\\/.test(line)) {
      if (!(await flush())) return out;
      const [cmd, arg] = line.trim().split(/\s+/);
      try {
        if (cmd === '\\dt') { const r = await db.query(`SELECT tablename AS tabela, tableowner AS dono FROM pg_tables WHERE schemaname = 'public' ORDER BY 1`, [], { rowMode: 'array' }); out.push({ kind: 'table', cols: ['tabela', 'dono'], rows: r.rows, empty: 'Nenhuma tabela ainda. Crie uma com CREATE TABLE.' }); }
        else if (cmd === '\\d' && arg) { const r = await db.query(`SELECT column_name AS coluna, data_type AS tipo, is_nullable AS aceita_nulo, column_default AS padrao FROM information_schema.columns WHERE table_schema = 'public' AND table_name = $1 ORDER BY ordinal_position`, [arg.replace(/;$/, '').toLowerCase()], { rowMode: 'array' }); out.push({ kind: 'table', cols: ['coluna', 'tipo', 'aceita_nulo', 'padrao'], rows: r.rows, empty: `A tabela "${arg}" não existe.` }); }
        else if (cmd === '\\l') out.push({ kind: 'table', cols: ['nome', 'dono', 'codificação'], rows: [['loja_dev', 'postgres', 'UTF8']] });
        else if (cmd === '\\c') out.push({ kind: 'info', msg: 'Você já está conectado ao banco do laboratório (loja_dev).' });
        else if (cmd === '\\q') out.push({ kind: 'info', msg: 'No laboratório não é preciso sair: é só fechar a aba quando terminar.' });
        else out.push({ kind: 'err', msg: `Comando psql "${cmd}" não suportado no laboratório. Disponíveis: \\dt, \\d tabela, \\l.` });
      } catch (e) { out.push({ kind: 'err', msg: String(e.message || e) }); return out; }
    } else buf.push(line);
  }
  await flush();
  return out;
}

function outHtml(blocks, ms) {
  if (!blocks.length) return `<div class="out-info">Nada para executar. Escreva um comando SQL e aperte Executar.</div>`;
  let h = '';
  blocks.forEach(b => {
    if (b.kind === 'table') {
      h += `<div class="out-scroll"><table class="res"><thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(v => v === null || v === undefined ? '<td class="null">NULL</td>' : `<td>${esc(fmt(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="res-foot">${b.rows.length === 1 ? '1 linha' : b.rows.length + ' linhas'}${!b.rows.length && b.empty ? ' · ' + esc(b.empty) : ''}</div>`;
    } else if (b.kind === 'ok') {
      h += `<div class="out-ok">Comando executado com sucesso${b.n ? ' · ' + b.n + (b.n === 1 ? ' linha afetada' : ' linhas afetadas') : ''}.</div>`;
    } else if (b.kind === 'info') {
      h += `<div class="out-info">${esc(b.msg)}</div>`;
    } else if (b.kind === 'err') {
      const hint = hintFor(b.msg);
      h += `<div class="out-err"><code class="raw">ERRO: ${esc(b.msg)}</code>${hint ? `<p>${esc(hint)}</p>` : ''}</div>`;
    }
  });
  return h + (ms != null ? `<div class="res-foot">${ms} ms · PostgreSQL rodando no seu navegador</div>` : '');
}

async function verifyMission(m) {
  const db = await labInit();
  await resetDataset(db, m.ds);
  const blocks = await runSql(db, $('#labsql').value);
  const bad = blocks.find(b => b.kind === 'err');
  if (bad) return { ok: false, msg: 'Sua consulta deu erro. Leia a mensagem acima, corrija e verifique de novo.', blocks };
  let got, exp;
  if (m.kind === 'select') {
    const tabs = blocks.filter(b => b.kind === 'table');
    if (!tabs.length) return { ok: false, msg: 'Não apareceu nenhuma tabela de resultado. Falta um SELECT?', blocks };
    got = tabs[tabs.length - 1];
    const r = await db.query(m.solution, [], { rowMode: 'array' });
    exp = { cols: r.fields.map(f => f.name), rows: r.rows };
    if (got.cols.length !== exp.cols.length) return { ok: false, msg: `Seu resultado tem ${got.cols.length} coluna(s) e o esperado tem ${exp.cols.length}. Releia o enunciado.`, blocks };
  } else {
    const r = await db.query(m.verify, [], { rowMode: 'array' });
    got = { rows: r.rows }; exp = { rows: m.expect };
  }
  let a = got.rows.map(r => JSON.stringify(r.map(fmt))), b = exp.rows.map(r => JSON.stringify(r.map(fmt)));
  if (m.kind === 'select' && got.rows.length !== exp.rows.length) return { ok: false, msg: `Seu resultado tem ${got.rows.length} linha(s) e o esperado tem ${exp.rows.length}. Confira os filtros.`, blocks };
  if (!m.ordered && m.kind === 'select') { a = a.slice().sort(); b = b.slice().sort(); }
  const same = a.length === b.length && a.every((x, i) => x === b[i]);
  if (!same) return { ok: false, msg: m.kind === 'select' ? 'As linhas não batem com o esperado. Confira os valores, os filtros' + (m.ordered ? ' e a ordem.' : '.') : 'O estado final do banco não é o esperado. Releia o enunciado e confira se só o necessário mudou.', blocks };
  return { ok: true, blocks };
}

  labInit().then(async () => {
    if (!$('#labstat')) return;
    $('#labstat').textContent = 'PostgreSQL pronto. Rodando no seu navegador.';
    await refreshTables();
  }).catch(e => {
    const st = $('#labstat'); if (!st) return;
    st.innerHTML = 'Não foi possível carregar o motor do PostgreSQL. Ele precisa de internet e de uma página hospedada (GitHub Pages, Vercel ou um arquivo aberto no navegador). Não funciona dentro do preview do Claude.';
    st.classList.add('bad');
  });
}
function markDs() { view.querySelectorAll('[data-ds]').forEach(b => b.classList.toggle('on', b.dataset.ds === LAB.dataset)); }
async function refreshTables() {
  const box = $('#labtables'); if (!box || !LAB.db) return;
  try {
    const r = await LAB.db.query(`SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY 1`, [], { rowMode: 'array' });
    const v = await LAB.db.query(`SELECT viewname FROM pg_views WHERE schemaname = 'public' ORDER BY 1`, [], { rowMode: 'array' });
    const names = r.rows.map(x => x[0]).concat(v.rows.map(x => x[0]));
    box.innerHTML = names.length ? '<span class="chips-l">Tabelas:</span>' + names.map(n => `<button type="button" class="chip" data-tab-sel="${esc(n)}">${esc(n)}</button>`).join('') : '<span class="chips-l">Nenhuma tabela ainda.</span>';
  } catch (e) {}
}
async function execLab() {
  if (LAB.busy) return; LAB.busy = true;
  const outBox = $('#labout'), btn = $('#labrun');
  btn.disabled = true; outBox.innerHTML = '<div class="out-info">Executando...</div>';
  try {
    const db = await labInit(); const t = performance.now();
    const blocks = await runSql(db, $('#labsql').value);
    if ($('#labout')) { $('#labout').innerHTML = outHtml(blocks, Math.round(performance.now() - t)); await refreshTables(); }
  } catch (e) { if ($('#labout')) $('#labout').innerHTML = `<div class="out-err"><code class="raw">${esc(String(e.message || e))}</code></div>`; }
  LAB.busy = false; if ($('#labrun')) $('#labrun').disabled = false;
}
function renderMissions() {
  const box = $('#missions'); if (!box) return;
  box.innerHTML = MISSIONS.map((m, i) => `<div class="card${S.lab[m.id] ? ' done' : ''}${LAB.mission === m.id ? ' sel' : ''}"><h3>${i + 1}. ${m.title}${S.lab[m.id] ? ' <span class="ok-b">concluída</span>' : ''}</h3><p>${m.brief}</p><button type="button" class="btn sm ghost" data-m="${m.id}">${LAB.mission === m.id ? 'Missão atual' : 'Escolher missão'}</button></div>`).join('');
  const pn = $('#mpanel');
  const m = MISSIONS.find(x => x.id === LAB.mission);
  if (!m) { pn.innerHTML = ''; return; }
  pn.innerHTML = `<div class="qbox" style="margin-top:8px"><div class="qtop"><span>Missão: ${m.title}</span><span>banco: ${m.ds === 'loja' ? 'loja de exemplo' : 'vazio'}</span></div><div class="qq" style="font-size:1.05rem;font-weight:500;font-family:var(--f-body)">${m.brief}</div><details><summary>Preciso de uma dica</summary><p style="margin-top:8px">${m.hint}</p></details><div class="qact"><button type="button" class="btn alt" id="mverify">Verificar missão</button></div><div id="mfb"></div></div>`;
  $('#mverify').onclick = async () => {
    const fb = $('#mfb'); fb.innerHTML = '<div class="fb">Conferindo...</div>';
    try {
      const r = await verifyMission(m);
      $('#labout').innerHTML = outHtml(r.blocks);
      if (r.ok) { const first = !S.lab[m.id]; S.lab[m.id] = true; save(); fb.innerHTML = `<div class="fb good"><b>Missão cumprida!</b> Seu SQL produziu exatamente o resultado esperado.</div>`; if (first) { renderMissions(); const c = view.querySelector('.cnt'); if (c) c.textContent = Object.keys(S.lab).length + '/' + MISSIONS.length; $('#mfb').innerHTML = `<div class="fb good"><b>Missão cumprida!</b> Seu SQL produziu exatamente o resultado esperado.</div>`; } }
      else fb.innerHTML = `<div class="fb bad"><b>Ainda não.</b> ${r.msg}</div>`;
      markDs(); await refreshTables();
    } catch (e) { fb.innerHTML = `<div class="fb bad">Não foi possível verificar agora: ${esc(String(e.message || e))}</div>`; }
  };
}

/* ---- eventos globais do laboratório ---- */
document.addEventListener('click', e => {
  const r = e.target.closest('[data-lab]');
  if (r) { LAB.code = LABCODE[+r.dataset.lab] || ''; go('lab'); return; }
  const m = e.target.closest('[data-m]');
  if (m) {
    LAB.mission = m.dataset.m; const mm = MISSIONS.find(x => x.id === LAB.mission);
    LAB.code = `-- Missão: ${mm.title}\n-- (banco: ${mm.ds === 'loja' ? 'loja de exemplo' : 'vazio'})\n\n`;
    const ta = $('#labsql'); ta.value = LAB.code;
    labInit().then(db => resetDataset(db, mm.ds)).then(() => { markDs(); return refreshTables(); }).catch(() => {});
    renderMissions(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  const t = e.target.closest('[data-tab-sel]');
  if (t) { const ta = $('#labsql'); ta.value = `SELECT * FROM ${t.dataset.tabSel};`; LAB.code = ta.value; execLab(); }
});
window.__t = { runSql, resetDataset, fmt, go: v => go(v), MODS, get S() { return S; }, LAB, MISSIONS, execLab, labInit };

go('home');

</script></body></html>
